server:
  host: 0.0.0.0
  port: 8099
theme:
  background-color: 216 44 5
  primary-color: 193 100 62
  positive-color: 156 72 56
  negative-color: 349 100 68
  contrast-multiplier: 1.2
  text-saturation-multiplier: 0.6
pages:
- name: Home
  width: wide
  columns:
  - size: small
    widgets:
    - type: split-column
      title: Today
      max-columns: 5
      widgets:
      - type: clock
        hour-format: 24h
        timezones:
        - timezone: Australia/Brisbane
          label: Brisbane
      - type: weather
        location: Brisbane, Australia
        units: metric
        hour-format: 24h
      - type: custom-api
        title: Year Progress
        cache: 1h
        url: http://127.0.0.1:9000/astro
        template: "<div class=\"astro-card compact\">\n  <div class=\"astro-big\">{{ .JSON.Float \"year.percent\" }}%</div>\n  <div class=\"astro-sub\">of {{ .JSON.Int \"year.year\" }} complete</div>\n  <div class=\"astro-bar\"><span style=\"width: {{ .JSON.Float \"year.percent\" }}%;\"></span></div>\n  <div class=\"astro-sub\">{{ .JSON.Int \"year.days_elapsed\" }} / {{ .JSON.Int \"year.days_total\" }} days</div>\n</div>\n"
      - type: custom-api
        title: Solar Events
        cache: 6h
        url: http://127.0.0.1:9000/astro
        template: "<div class=\"astro-card compact\">\n  <div class=\"astro-label\">Next</div>\n  <div class=\"astro-title\">{{ .JSON.String \"solar.next.name\" }}</div>\n  <div class=\"astro-sub\">{{ .JSON.String \"solar.next.date\" }} · {{ .JSON.Int \"solar.next.days_until\" }} days</div>\n  <div class=\"astro-mini-list\">\n    {{ range .JSON.Array \"solar.events\" }}\n      <div><span>{{ .String \"name\" }}</span><b>{{ .String \"date\" }}</b></div>\n    {{ end }}\n  </div>\n</div>\n"
      - type: custom-api
        title: Moon & Zodiac
        cache: 6h
        url: http://127.0.0.1:9000/astro
        template: "<div class=\"astro-card compact\">\n  <div class=\"astro-moon\">{{ .JSON.String \"moon.icon\" }}</div>\n  <div class=\"astro-title\">{{ .JSON.String \"moon.phase\" }}</div>\n  <div class=\"astro-sub\">{{ .JSON.Int \"moon.illumination\" }}% illumination · {{ .JSON.Float \"moon.age\" }} days old</div>\n  <div class=\"astro-zodiac\">{{ .JSON.String \"zodiac.symbol\" }} {{ .JSON.String \"zodiac.name\" }}</div>\n</div>\n"
    - type: search
      search-engine: duckduckgo
      new-tab: true
    - type: server-stats
      servers:
      - type: local
        name: k3s / Glance
  - size: full
    widgets:
    - type: custom-api
      title: At a Glance
      cache: 1m
      url: http://127.0.0.1:9000/stats
      template: "<div class=\"home-overview\">\n  <div class=\"home-hero\">\n    <span>Homelab</span>\n    <b>{{ .JSON.Int \"summary.apps_ok\" }} / {{ .JSON.Int \"summary.apps_total\" }} apps OK</b>\n    <small>{{ .JSON.Int \"cluster.pods_running\" }} pods running - {{ .JSON.Int \"cluster.pods_failed\" }} failed - {{ .JSON.Float \"cluster.memory_used_pct\" }}% memory</small>\n  </div>\n  <div class=\"home-grid\">\n    <div><span>Disk /</span><b>{{ .JSON.Float \"cluster.disk_used_pct\" }}%</b><small>{{ .JSON.String \"cluster.disk_available\" }} free</small></div>\n    <div><span>Downloads</span><b>{{ .JSON.String \"summary.downloads.qbit_down\" }}</b><small>qBit down</small></div>\n    <div><span>Media</span><b>{{ .JSON.Int \"summary.media.movies\" }} / {{ .JSON.Int \"summary.media.series\" }}</b><small>movies / series</small></div>\n    <div><span>Metrics</span><b>{{ .JSON.String \"cluster.prometheus\" }}</b><small>Prometheus</small></div>\n  </div>\n</div>"
    - type: custom-api
      title: Needs Attention
      cache: 1m
      url: http://127.0.0.1:9000/guide-api/status
      template: "<div class=\"briefing-list compact\">\n  {{ range .JSON.Array \"problem_namespaces\" }}\n    <div class=\"briefing-row alert\">\n      <div class=\"briefing-meta\"><span>{{ .String \"namespace\" }}</span><span>{{ .Int \"running\" }} running</span></div>\n      <b>{{ .Int \"failed\" }} failed - {{ .Int \"pending\" }} pending - {{ .Int \"unavailable\" }} unavailable</b>\n      <small>{{ .Int \"restarts\" }} total restarts</small>\n    </div>\n  {{ else }}\n    <div class=\"briefing-row\"><b>No cluster attention items</b><small>Namespaces are clear for pending, failed, and unavailable counts.</small></div>\n  {{ end }}\n</div>"
    - type: monitor
      title: Core Status
      cache: 1m
      sites:
      - title: Stremio Web
        url: https://web.stremio.com
        icon: si:stremio
      - title: Grafana
        url: https://grafana.internal.homelab.example
        check-url: http://grafana.monitoring.svc.cluster.local:3000/api/health
        icon: sh:grafana
      - title: Prometheus
        url: https://prometheus.internal.homelab.example
        check-url: http://prometheus.monitoring.svc.cluster.local:9090/-/healthy
        icon: sh:prometheus
  - size: small
    widgets:
    - type: bookmarks
      groups:
      - title: Media
        links:
        - title: Stremio
          url: https://web.stremio.com
          icon: si:stremio
      - title: Infra
        links:
        - title: Grafana
          url: https://grafana.internal.homelab.example
          icon: sh:grafana
        - title: Prometheus
          url: https://prometheus.internal.homelab.example
          icon: sh:prometheus
        - title: Traefik dashboard
          url: https://traefik-dashboard.internal.homelab.example
          icon: sh:traefik
      - title: AI
        links:
        - title: WatooM Code
          url: https://watoom-code.internal.homelab.example
          icon: mdi:code-braces
        - title: OpenCode
          url: https://opencode.internal.homelab.example
          icon: mdi:robot
        - title: LLM router
          url: https://llm-router.internal.homelab.example
          icon: mdi:router-network
        - title: Qwen38
          url: https://qwen38.internal.homelab.example
          icon: mdi:brain
        - title: Toolkit
          url: https://toolkit.internal.homelab.example
          icon: mdi:toolbox
        - title: SearXNG
          url: https://searxng.internal.homelab.example
          icon: si:searxng
      - title: Security
        links:
        - title: Artex
          url: https://artex.internal.homelab.example
          icon: mdi:shield-bug
        - title: Kali console
          url: https://glance.internal.homelab.example/kali-console
          icon: si:kalilinux
      - title: Admin
        links:
        - title: Tickets board
          url: https://glance.internal.homelab.example/tickets/
          icon: mdi:ticket-confirmation
        - title: Skill editor
          url: https://glance.internal.homelab.example/skills
          icon: mdi:pencil-ruler
        - title: IaC console
          url: https://iac-console.internal.homelab.example
          icon: mdi:console
- name: Command Center
  width: wide
  columns:
  - size: full
    widgets:
    - type: iframe
      source: https://glance.internal.homelab.example/command-center/
      height: 860
    # Tickets board counts (ansible/roles/tickets-board, tools/tickets/board). Read-only, no login: numbers and lane labels only.
    - type: custom-api
      title: Tickets
      title-url: https://glance.internal.homelab.example/tickets/
      cache: 1m
      url: http://tickets-board.glance.svc.cluster.local:8789/tickets/api/summary
      template: |
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center">
          <div><div class="size-h3 color-highlight">{{ .JSON.Int "queues.requests" }}</div><div class="size-h6">Requests</div></div>
          <div><div class="size-h3 color-highlight">{{ .JSON.Int "queues.issues" }}</div><div class="size-h6">Issues</div></div>
          <div><div class="size-h3 color-highlight">{{ .JSON.Int "queues.backlog" }}</div><div class="size-h6">Backlog</div></div>
          <div><div class="size-h3 color-highlight">{{ .JSON.Int "queues.wip" }}</div><div class="size-h6">In progress</div></div>
        </div>
        <p class="size-h6">{{ range .JSON.Array "lanes" }}{{ .String "label" }} {{ .Int "count" }} · {{ end }}{{ .JSON.Int "blocked" }} blocked · {{ .JSON.Int "pending_change_requests" }} change requests waiting</p>
    - type: custom-api
      title: MOSS Image - latest results
      cache: 1m
      url: http://10.242.0.1:8791/api/gallery?limit=6
      template: |
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px">
        {{ range .JSON.Array "items" }}
          <a href="https://glance.internal.homelab.example/moss/" title="{{ .String "scene" }}"><img loading="lazy" style="width:100%;border-radius:6px;display:block" src="https://glance.internal.homelab.example/moss/api/images/{{ .String "image" }}" alt="{{ .String "scene" }}"></a>
        {{ else }}<p>No images yet. Open MOSS Studio and start a GPU session.</p>{{ end }}
        </div>
  - size: small
    widgets:
    - type: server-stats
      servers:
      - type: local
        name: k3s / Glance
    - type: custom-api
      title: Namespace Workloads
      cache: 30s
      url: http://127.0.0.1:9000/cluster-detail
      template: "<div class=\"ops-table\">\n  <div class=\"ops-table-row head\"><span>Namespace</span><span>Pods</span><span>Deploy</span><span>Restarts</span></div>\n  {{ range .JSON.Array \"namespaces\" }}\n    <div class=\"ops-table-row {{ .String \"status\" }}\">\n      <span><b>{{ .String \"namespace\" }}</b><small>{{ .Int \"pending\" }} pending - {{ .Int \"failed\" }} failed</small></span>\n      <span>{{ .Int \"running\" }} run</span>\n      <span>{{ .Int \"available\" }}/{{ .Int \"desired\" }} avail</span>\n      <span>{{ .Int \"restarts\" }}</span>\n    </div>\n  {{ end }}\n</div>"
    - type: custom-api
      title: Restart Hotspots
      cache: 30s
      url: http://127.0.0.1:9000/cluster-detail
      template: "<div class=\"ops-table compact\">\n  <div class=\"ops-table-row head\"><span>Pod</span><span>Namespace</span><span>Container</span><span>Restarts</span></div>\n  {{ range .JSON.Array \"restart_hotspots\" }}\n    <div class=\"ops-table-row\">\n      <span><b>{{ .String \"pod\" }}</b></span>\n      <span>{{ .String \"namespace\" }}</span>\n      <span>{{ .String \"container\" }}</span>\n      <span>{{ .Int \"restarts\" }}</span>\n    </div>\n  {{ else }}\n    <div class=\"ops-table-row\"><span><b>No restart hotspots</b><small>No container restart totals above zero.</small></span><span></span><span></span><span></span></div>\n  {{ end }}\n</div>"
- name: Hub
  width: wide
  columns:
  - size: full
    widgets:
    - type: html
      source: |
        <div style="line-height:1.55">
        <h3>How to reach each tool</h3>
        <p><b>MOSS Image Studio</b> opens in your browser (below). Press <i>Start GPU session</i> first: it starts as soon as WatooM Code is not running anything, then pauses the LLM, and restores it after 10 idle minutes or when you press End.</p>
        <p><b>LLaMA-Mesh</b> has no web page. You use it by asking WatooM Code for a 3D mesh (its <i>watoom-llama-mesh</i> tool) or from the host with <code>scripts/llama-mesh</code>. Finished meshes are written to <code>/data/ai/assets/generated/llama-mesh/</code>. Like MOSS, it takes the GPU through the GPU controller.</p>
        <p><b>Everything else</b> is linked below. Only one GPU job runs at a time: the LLM, Mesh and MOSS take turns.</p>
        </div>
    - type: bookmarks
      title: Create
      groups:
      - links:
        - title: MOSS Image Studio
          url: https://glance.internal.homelab.example/moss/
          icon: mdi:image-auto-adjust
        - title: Creation Studio
          url: https://glance.internal.homelab.example/creation/
          icon: mdi:cube-send
        - title: Writing Studio
          url: https://glance.internal.homelab.example/writing/
          icon: mdi:book-open-page-variant
        - title: WatooM Code (agents, Mesh, builds)
          url: https://watoom-code.internal.homelab.example
          icon: mdi:code-braces
        - title: LLaMA-Mesh workflow guide
          url: https://glance.internal.homelab.example/guide/ai.html
          icon: mdi:cube-outline
        - title: Pipeline prompt templates
          url: https://glance.internal.homelab.example/guide/pipeline-prompts.html
