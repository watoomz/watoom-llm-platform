<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WatooM · 3D viewer</title>
<link rel="stylesheet" href="/command-center/cc.css">
<style>
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--plane); color: var(--ink); font-family: var(--sans); }
  .vw-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 14px; border-bottom: 1px solid var(--hair); background: var(--surface); font-size: 12px; }
  .vw-title { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
  .vw-bar .sp { flex: 1; }
  .vw-bar label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); cursor: pointer; }
  .vw-bar select, .vw-bar button, .vw-bar a.btn { background: var(--surface-2, #232321); color: var(--ink); border: 1px solid var(--hair); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; text-decoration: none; cursor: pointer; }
  .vw-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  model-viewer { flex: 1; width: 100%; min-height: 0; --poster-color: transparent; background: radial-gradient(circle at 50% 35%, #34343a 0%, #17171a 70%); }
  body.light model-viewer { background: radial-gradient(circle at 50% 35%, #ffffff 0%, #c9ccd2 75%); }
  .vw-msg { position: absolute; inset: 56px 0 0 0; display: grid; place-items: center; pointer-events: none; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
  .vw-msg.err { color: var(--serious); }
  .vw-prog { height: 3px; background: var(--accent); width: 0; transition: width .2s; }
</style>
</head>
<body>
  <div class="vw-bar">
    <span class="vw-title" id="vw-title">3D model</span>
    <span class="vw-meta" id="vw-meta"></span>
    <span class="sp"></span>
    <label id="vw-anim-wrap" hidden>Animation <select id="vw-anim"></select></label>
    <label><input type="checkbox" id="vw-rot" checked> auto-rotate</label>
    <label><input type="checkbox" id="vw-light"> light background</label>
    <button type="button" id="vw-reset">Reset view</button>
    <a class="btn" id="vw-dl" download>Download .glb</a>
  </div>
  <div class="vw-prog" id="vw-prog"></div>
  <model-viewer id="mv" camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1" shadow-softness="0.8" exposure="1.05" environment-image="neutral" interaction-prompt="none" alt="3D model produced by a worker job"></model-viewer>
  <div class="vw-msg" id="vw-msg">Loading model…</div>
  <script type="module" src="/command-center/vendor/model-viewer.min.js"></script>
  <script src="/command-center/viewer.js" defer></script>
</body>
</html>
