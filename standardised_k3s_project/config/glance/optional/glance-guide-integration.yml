apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: glance
    app.kubernetes.io/part-of: glance
  name: glance
  namespace: glance
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: glance
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-08-13T07:55:02+10:00'
      labels:
        app: glance
        app.kubernetes.io/name: glance
        app.kubernetes.io/part-of: glance
    spec:
      automountServiceAccountToken: false
      containers:
      - envFrom:
        - secretRef:
            name: glance-secrets
        image: glanceapp/glance:v0.8.5
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8099
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: glance
        ports:
        - containerPort: 8099
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8099
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/config/glance.yml
          name: config
          subPath: glance.yml
      - command:
        - python
        - /app/helper.py
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: GLANCE_GUIDE_ROOT
          value: /app/guide
        envFrom:
        - secretRef:
            name: glance-secrets
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 9000
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: helper-api
        ports:
        - containerPort: 9000
          name: helper
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 9000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/helper.py
          name: helper
          subPath: helper.py
        - name: guide
          mountPath: /app/guide
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: glance-config
        name: config
      - configMap:
          defaultMode: 420
          name: glance-helper
        name: helper
      - name: guide
        hostPath:
          path: /data/github/watoom-standardised-homelab/standardised_k3s_project/config/glance/guide
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: glance
    app.kubernetes.io/part-of: glance
  name: glance
  namespace: glance
spec:
  clusterIP: 10.243.77.163
  clusterIPs:
  - 10.243.77.163
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 8099
    protocol: TCP
    targetPort: 8099
  - name: helper-web
    port: 9000
    protocol: TCP
    targetPort: 9000
  selector:
    app: glance
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: glance
    app.kubernetes.io/part-of: glance
  name: glance
  namespace: glance
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`glance.internal.homelab.example`) && (PathPrefix(`/guide`) || PathPrefix(`/guide-api`))
    priority: 100
    services:
    - name: glance
      nativeLB: true
      port: 9000
  - kind: Rule
    match: Host(`glance.internal.homelab.example`)
    priority: 10
    services:
    - name: glance
      nativeLB: true
      port: 8099
  tls: {}
