# Raised 2026-11-09: traced the OOM crash loop into @agentmemory/agentmemory@0.9.29's own load path
# (IndexPersistence.load(), single eager call at boot) -- it deserializes the current BM25 + vector index
# generations (confirmed via the live manifest: ~145MB + ~108MB serialized) plus mem:memories.bin (~93MB)
# into live JS structures every restart. That is real, current, referenced data -- not a leak -- and
# dmesg confirmed the iii engine process alone reaching ~2.7GB RSS from it within ~20s of start. 4Gi no
# longer has headroom for that plus the node/BGE/OTel baseline. 8Gi gives roughly 3x the observed peak.
watoom_code_agentmemory_memory_limit: 8Gi
# Hybrid recall through resident BGE; watoom-code-memory-embeddings.yml -e watoom_code_memory_embeddings=false is the BM25-only rollback.
watoom_code_memory_embeddings: true
# Fixed 2026-11-09: config/agentmemory/iii-config.yaml's iii-observability worker was configured with
# exporter: memory, sampling_ratio: 1.0 and logs_enabled: true -- retaining every trace/log event in the
# process's own heap with no visible eviction. Matched the observed symptom exactly: agentmemory OOMKilled
# roughly hourly (9 restarts in ~9h before this fix), its own iii worker process measured at 2.6GB+ RSS alone
# shortly before each kill. Cut sampling ~100x and stopped in-memory log retention (logs_console_output still
# gives stdout visibility). Rollback: the previous digest below.
