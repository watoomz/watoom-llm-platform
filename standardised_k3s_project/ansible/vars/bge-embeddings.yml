# Same llama.cpp build as the Swift/Qwen server (b10666, commit 4e97ac86e).
bge_llama_image: ghcr.io/ggml-org/llama.cpp@sha256:150b59966fb5b2cb1a8fa9d226267c56ebd22c520c7b3640331cde87f3c4fb01
bge_namespace: llama-cpp
bge_name: bge-embeddings
bge_model_name: bge-small-en-v1.5
# Measured 2026-10-29 beside Swift: +307 MiB idle, +329 MiB peak (artifacts/bge-agentmemory).
# Keeps the controller's released_gpu_max_mib (1500) satisfied: baseline ~520 + 329 MiB.
bge_vram_budget_mib: 400   # only used when bge_gpu_layers > 0
# 2026-11-11 owner choice: run on the CPU. The CUDA context cost ~0.4 GiB host RAM and 324 MiB VRAM (VRAM was 18.4/20 GiB).
# 0 = CPU only (CUDA devices hidden from the container); 99 = the previous GPU-resident layout. Measured throughput:
# see docs/16 or the commit message for GPU 16.8 windows/s vs CPU.
bge_gpu_layers: 0
bge_cpu_threads: 2
# Bulk re-embedding pace (windows/s). Saturating batches (~330/s) cost Swift ~12% prompt and
# ~19% generation speed (wp8-swift-interference-20261029.json); 100/s caps that duty to ~30%.
bge_batch_windows_per_second: 100
# While the GPU controller reports an active chat request, bulk batches drop to this rate.
bge_busy_windows_per_second: 25
bge_gpu_observation_dir: /data/ai/helper-scripts/state/gpu-controller-observability
