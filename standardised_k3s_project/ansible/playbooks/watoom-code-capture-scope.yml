---
- name: Activate precise capture admission diagnostics under native fence
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require native release fence
      ansible.builtin.assert:
        that: watoom_render_routing_guard_held | default(false) | bool
    - name: Install immutable capture guard diagnostics
      ansible.builtin.import_role:
        name: watoom-code
        tasks_from: coordinator_guard
    - name: Install capture project preflight guidance
      ansible.builtin.copy:
        src: ../roles/watoom-code/files/skills/asset-image-clip-capture/SKILL.md
        dest: /data/ai/watoom-code/config/skills/asset-image-clip-capture/SKILL.md
        owner: '1001'
        group: '1001'
        mode: '0644'
