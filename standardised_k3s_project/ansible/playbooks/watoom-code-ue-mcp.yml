---
- name: Maintain only the ue-mcp integration in the watoom-code configuration
  hosts: homelab
  become: true
  gather_facts: false
  vars_files:
    - ../vars/watoom-code.yml
  tasks:
    - name: Merge (or remove) the watoom-ue MCP entry in existing configuration
      ansible.builtin.import_role:
        name: watoom-code
        tasks_from: ue_mcp
