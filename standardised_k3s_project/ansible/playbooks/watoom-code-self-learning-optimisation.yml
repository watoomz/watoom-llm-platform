---
- name: Schedule guarded existing Skill improvement and rollback
  hosts: watoom-homelab
  become: true
  gather_facts: false
  vars:
    watoom_learning_evidence: /data/ai/helper-scripts/watoom-self-learning-20261024T191207Z
  tasks:
    - name: Require the private approved release evidence root
      ansible.builtin.assert:
        that:
          - watoom_learning_evidence is match('^/data/ai/helper-scripts/watoom-self-learning-[0-9TZ]+$')
    - name: Install the deterministic existing Skill controller
      ansible.builtin.copy:
        dest: /etc/systemd/system/watoom-learning-optimisation.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Guarded native existing Skill optimisation
          After=k3s.service
          [Service]
          Type=oneshot
          User=root
          WorkingDirectory=/
          ExecStart=/usr/bin/python3 -I {{ playbook_dir }}/../../tools/watoom-code/self_learning/optimise.py --evidence {{ watoom_learning_evidence }}
          ExecStopPost=/usr/bin/python3 -I {{ playbook_dir }}/../../tools/watoom-code/self_learning/optimisation_failure.py \
            --evidence {{ watoom_learning_evidence }}
          TimeoutStartSec=1800
          MemoryMax=512M
          CPUQuota=100%
    - name: Install the bounded optimisation schedule
      ansible.builtin.copy:
        dest: /etc/systemd/system/watoom-learning-optimisation.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Check proven Skill improvements at idle
          [Timer]
          OnBootSec=5min
          OnUnitInactiveSec=5min
          Unit=watoom-learning-optimisation.service
          [Install]
          WantedBy=timers.target
    - name: Enable guarded periodic improvement
      ansible.builtin.systemd_service:
        name: watoom-learning-optimisation.timer
        daemon_reload: true
        enabled: true
        state: started
