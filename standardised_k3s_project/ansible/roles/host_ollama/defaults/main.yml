---
# Host Ollama is intentionally separate from the in-cluster Ollama deployment.
# Use it when the server has a dedicated GPU that should be driven directly by
# Fedora/systemd instead of Kubernetes GPU scheduling.
host_ollama_install: false
host_ollama_service_enabled: true
host_ollama_service_state: started

# Binding to the LAN lets desktop tools use the OpenAI-compatible Ollama API.
# Keep the firewall rule paired with this value so rebuilds remain predictable.
host_ollama_host: 0.0.0.0:11434
host_ollama_firewall_port: 11434/tcp
host_ollama_open_firewall: true

# Keep only one model resident so the 20GB GPU can swap cleanly between the
# larger ops model and smaller chat model instead of overcommitting VRAM.
host_ollama_max_loaded_models: 1
host_ollama_keep_alive: 5m

# Model definitions are prepared only. The role does not pull or create models;
# run the documented commands after the 3080 is installed and verified.
host_ollama_model_dir: /etc/ollama/models.d
host_ollama_models:
  - name: ops
    source: qwen3.8:27b
    file: ops-qwen3.8-27b.Modelfile
    num_ctx: 16384
    temperature: 0.2
    repeat_penalty: 1.08
    system: |-
      You are WatooM's local homelab operations and Ansible Automation Platform assistant.
      Prioritise accurate, rebuildable infrastructure-as-code guidance. Prefer simple
      Ansible roles, playbooks, Kubernetes manifests, and operational checks that match
      the repository's existing patterns. Do not invent modules or hidden tooling.
      Ask for current official documentation context when module arguments are uncertain.
  - name: chat
    source: qwen3.5:9b-q4_K_M
    file: chat-qwen3.5-9b.Modelfile
    num_ctx: 8192
    temperature: 0.6
    repeat_penalty: 1.05
