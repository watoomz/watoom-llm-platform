---
- name: "Audio host | Install audio packages"
  ansible.builtin.dnf:
    name:
      - alsa-utils
      - alsa-plugins-pulseaudio
      - pavucontrol
      - pipewire-alsa
      - kernel-modules
      - kernel-modules-extra
      - alsa-sof-firmware
    state: present

- name: "Audio snd_hda_intel | Load kernel module"
  community.general.modprobe:
    name: snd_hda_intel
    state: present
