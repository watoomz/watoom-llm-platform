---
opencode_agent_version: "2.0.18"
opencode_agent_namespace: "opencode"
opencode_agent_deployment: "opencode-v2-canary"
opencode_agent_service: "opencode"
opencode_agent_port: 4096
opencode_agent_hostname: "opencode.internal.homelab.example"

opencode_agent_image: "127.0.0.1:5000/watoom-opencode-coding-v2:2.0.18-unreal1-browser1"
opencode_agent_state_root: "/app/ai/services/opencode"
opencode_agent_image_root: "/app/ai/services/opencode/image"
opencode_agent_render_root: "/app/ai/services/opencode/rendered"
opencode_agent_home_path: "/app/ai/services/opencode/home"
opencode_agent_secret_root: "/app/ai/services/opencode/secrets"
opencode_agent_password_file: "/app/ai/services/opencode/secrets/server-password"

opencode_agent_workspace_host: "/data/ai/projects"
opencode_agent_workspace_mount: "/workspace"
opencode_agent_run_uid: 1009
opencode_agent_run_gid: 1009

# BEGIN WATOOM OPENCODE CODING WORKSPACE V1
opencode_agent_cpu_request: "250m"
opencode_agent_memory_request: "512Mi"
opencode_agent_cpu_limit: "6"
opencode_agent_memory_limit: "8Gi"
# END WATOOM OPENCODE CODING WORKSPACE V1

opencode_agent_provider_id: "watoom"
opencode_agent_model_id: "swift-qwen38-coder"
opencode_agent_router_base_url: "http://llm-router.llama-cpp.svc.cluster.local:8000/v1"

opencode_agent_server_username: "opencode"
opencode_agent_tls_secret: "watoom-tls"
opencode_agent_enable_ingress: true

# Legacy canary is retired from normal use. Production is watoom-code in
# watoom-code. Explicitly override to 1 only for an isolated test.
opencode_agent_replicas: 0
opencode_agent_suspend_i_approve: false
opencode_agent_suspend_evidence: "/data/ai/helper-scripts/reports/opencode-canary-suspend-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"

# BEGIN WATOOM V2 LOOP GUARD DEFAULTS
opencode_v2_loop_guard_enabled: true

# Third consecutive identical read is mechanically blocked.
opencode_v2_loop_guard_identical_read_limit: 3

# Detect A/B/A/B/A/B exact read cycles.
opencode_v2_loop_guard_alternating_read_cycles: 3

# Expire abandoned per-session detector state after two hours.
opencode_v2_loop_guard_state_ttl_ms: 7200000

# Persistent V2 home and workspace.
opencode_v2_loop_guard_home_root: "/app/ai/services/opencode/home"
opencode_v2_loop_guard_project_root: "/data/ai/projects"

# Production Service promotion.
#
# Legacy services must not be promoted as production by this role.
# Production access belongs to the separate watoom-code role.
opencode_v2_promote_production_service: false
opencode_v2_production_service_name: "opencode"
opencode_v2_production_service_selector:
  app: "opencode-v2-canary"
# END WATOOM V2 LOOP GUARD DEFAULTS

# WATOOM-SEARXNG-SEARCH-BEGIN
# Internal SearXNG endpoint used by the OpenCode native search tool.
opencode_agent_searxng_url: "http://searxng.searxng.svc.cluster.local:8080"
opencode_agent_searxng_max_results: 10
opencode_agent_searxng_timeout_ms: 18000
# WATOOM-SEARXNG-SEARCH-END

# OpenSpec CLI used by the OpenCode V2 OPSX workflow.
# Keep pinned so the generated workflow contract and runtime CLI stay aligned.
opencode_agent_openspec_version: "1.13.2"

# Keep sparse Unreal build cache on the bulk data filesystem.
opencode_agent_v2_canary_build_cache_host: "/data/ai/caches/opencode-v2-canary/unreal-build-accelerator"

# Historical OpenCode V2 canary image; retained for explicitly approved tests.
opencode_agent_v2_canary_version: 2.0.18
opencode_agent_v2_canary_image_tag: 2.0.18-unreal1-browser1-godot1-blender42-1
opencode_agent_v2_canary_image: 127.0.0.1:5000/watoom-opencode-coding-v2:{{ opencode_agent_v2_canary_image_tag
  }}
opencode_agent_v2_canary_image_root: /app/ai/services/opencode/image
opencode_agent_v2_canary_namespace: '{{ opencode_agent_namespace }}'
opencode_agent_v2_canary_deployment: opencode-v2-canary
opencode_agent_v2_canary_service: opencode-v2-canary
opencode_agent_v2_canary_port: 4096
opencode_agent_v2_canary_state_root: /app/ai/services/opencode
opencode_agent_v2_canary_home_path: /app/ai/services/opencode/home
opencode_agent_v2_canary_render_root: /app/ai/services/opencode/rendered
opencode_agent_v2_canary_workspace_host: /data/ai/projects
opencode_agent_v2_canary_workspace_mount: /workspace
opencode_agent_v2_canary_unreal_engine_host: /data/ai/assets/unreal-engine
opencode_agent_v2_canary_unreal_engine_mount: /unreal-engine
opencode_agent_v2_canary_unreal_project_host: '{{ opencode_agent_v2_canary_workspace_host
  }}/games/wombat-australia'
opencode_agent_v2_canary_cpu_request: 250m
opencode_agent_v2_canary_memory_request: 512Mi
opencode_agent_v2_canary_cpu_limit: '6'
opencode_agent_v2_canary_memory_limit: 8Gi
opencode_agent_context_limit: 102400
opencode_agent_output_limit: 4096
opencode_agent_v2_canary_compaction_keep_tokens: 6000
opencode_agent_v2_canary_compaction_buffer: 8192

# Toolkit integration is explicitly enabled by the homelab inventory.
opencode_agent_v2_canary_toolkit_bridge_enabled: false
opencode_agent_v2_canary_toolkit_secret_name: watoom-toolkit-opencode-token

# Existing Mesh bridge callers: WatooM Code UID, alongside the canary UID.
opencode_agent_mesh_additional_uids: [1001]

opencode_agent_mesh_checkpoint_databases:
  '1001': /data/ai/watoom-code/application.sqlite
