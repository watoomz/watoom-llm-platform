---
- name: OpenCode V2 Toolkit | Ensure native policy directories
  ansible.builtin.file:
    path: "{{ opencode_agent_v2_canary_home_path }}/.config/opencode/{{ item }}"
    state: directory
    owner: "{{ opencode_agent_run_uid }}"
    group: "{{ opencode_agent_run_gid }}"
    mode: "0755"

  loop:
    - context
    - plugins

- name: OpenCode V2 Toolkit | Install native policy and credential guard
  ansible.builtin.copy:
    src: "v2-native/{{ item }}"
    dest: "{{ opencode_agent_v2_canary_home_path }}/.config/opencode/{{ item }}"
    owner: "{{ opencode_agent_run_uid }}"
    group: "{{ opencode_agent_run_gid }}"
    mode: "0644"
  loop:
    - context/toolkit-first.md
    - plugins/toolkit-secret-guard/
    - plugins/toolkit-native/
    - plugins/toolkit-3d-native/
    - skills/vision-3d-inspector/

- name: OpenCode V2 Toolkit | Verify existing credential reference
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ opencode_agent_v2_canary_namespace }}"
      - get
      - secret
      - "{{ opencode_agent_v2_canary_toolkit_secret_name }}"
      - -o
      - name
  changed_when: false
  when: opencode_agent_v2_canary_toolkit_bridge_enabled | bool

# The historical V1 custom-tool file remains inert for reviewed rollback.
# V2 registers the four fixed tools through the native plugin above.
