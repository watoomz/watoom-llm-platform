---
- name: OpenCode verify | Show pod
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ opencode_agent_namespace }}"
      - get
      - pods
      - -l
      - "app={{ opencode_agent_deployment }}"
      - -o
      - wide
  changed_when: false

- name: OpenCode verify | Require service endpoint
  ansible.builtin.shell: |
    set -Eeuo pipefail
    endpoint="$(kubectl -n "{{ opencode_agent_namespace }}" get endpoints "{{ opencode_agent_service }}" -o jsonpath='{.subsets[0].addresses[0].ip}' 2>/dev/null || true)"
    [[ -n "$endpoint" ]]
    echo "$endpoint"
  args:
    executable: /bin/bash
  changed_when: false

- name: OpenCode verify | Check installed version
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ opencode_agent_namespace }}"
      - exec
      - "deployment/{{ opencode_agent_deployment }}"
      - --
      - opencode
      - --version
  register: opencode_version_output
  changed_when: false
  failed_when: opencode_agent_version not in opencode_version_output.stdout

- name: OpenCode verify | Check coding toolchain and writable workspace
  ansible.builtin.shell: |
    set -Eeuo pipefail
    kubectl -n "{{ opencode_agent_namespace }}" exec "deployment/{{ opencode_agent_deployment }}" -- bash -lc '
      set -Eeuo pipefail
      test -d "{{ opencode_agent_workspace_mount }}"
      test -w "{{ opencode_agent_workspace_mount }}"
      for cmd in \
        git git-lfs ssh curl jq yq rg fd \
        gcc g++ clang clangd cmake ninja meson gdb \
        python python3 pip3 pipx \
        node npm npx \
        go rustc cargo \
        java javac mvn \
        shellcheck sqlite3; do
          command -v "$cmd" >/dev/null || {
            echo "missing required coding tool: $cmd" >&2
            exit 1
          }
      done
      echo "coding toolchain: PASS"
      echo "workspace={{ opencode_agent_workspace_mount }} writable: PASS"
    '
  args:
    executable: /bin/bash
  changed_when: false

- name: OpenCode verify | Check router health and active-model advertisement
  ansible.builtin.shell: |
    set -Eeuo pipefail
    kubectl -n "{{ opencode_agent_namespace }}" exec "deployment/{{ opencode_agent_deployment }}" -- \
      curl -fsS "http://llm-router.llama-cpp.svc.cluster.local:8000/health"
    echo
    kubectl -n "{{ opencode_agent_namespace }}" exec "deployment/{{ opencode_agent_deployment }}" -- \
      curl -fsS "http://llm-router.llama-cpp.svc.cluster.local:8000/v1/models" \
      | grep -F '"id": "active-model"'
  args:
    executable: /bin/bash
  changed_when: false

- name: OpenCode verify | Show service and ingress
  ansible.builtin.shell: |
    set -Eeuo pipefail
    kubectl -n "{{ opencode_agent_namespace }}" get svc "{{ opencode_agent_service }}" -o wide
    if kubectl -n "{{ opencode_agent_namespace }}" get ingressroute "{{ opencode_agent_service }}" >/dev/null 2>&1; then
      kubectl -n "{{ opencode_agent_namespace }}" get ingressroute "{{ opencode_agent_service }}" -o wide
    fi
  args:
    executable: /bin/bash
  changed_when: false
