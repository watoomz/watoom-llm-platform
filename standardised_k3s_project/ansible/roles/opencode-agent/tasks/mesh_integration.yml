---
- name: Read installed pipeline for narrow compatibility fix
  ansible.builtin.slurp:
    src: /data/ai/helper-scripts/llama_mesh_pipeline.py
  register: mesh_pipeline_source

- name: Add bounded idle wait for asynchronous OpenCode acknowledgement
  ansible.builtin.replace:
    path: /data/ai/helper-scripts/llama_mesh_pipeline.py
    regexp: '^def generate\(c,request,job\):'
    replace: |
      def safe_when_idle(c,phase):
          deadline=time.monotonic()+90
          while True:
              try:
                  safe(c)
                  return
              except RuntimeError as error:
                  if str(error)!='Primary inference busy; retry when idle' or time.monotonic()>=deadline:
                      raise
                  phase('waiting-primary-idle')
                  time.sleep(2)

      def generate(c,request,job):
    backup: true
  when: "'def safe_when_idle(' not in (mesh_pipeline_source.content | b64decode)"

- name: Use bounded idle wait while preserving all preflight safety checks
  ansible.builtin.replace:
    path: /data/ai/helper-scripts/llama_mesh_pipeline.py
    regexp: '        safe\(c\);write\(job/''primary-before.json'',obj\(c,''deployment'',c\[''primary''\]\)\)'
    replace: "        safe_when_idle(c,phase);write(job/'primary-before.json',obj(c,'deployment',c['primary']))"
    backup: true

- name: Ensure narrow mesh bridge socket directory
  ansible.builtin.file:
    path: "{{ opencode_agent_v2_canary_home_path }}/.config/opencode/mesh-bridge"
    state: directory
    owner: root
    group: "{{ opencode_agent_run_gid }}"
    mode: "0750"

- name: Install host mesh bridge
  ansible.builtin.copy:
    src: "{{ role_path }}/../llm-model-lab/files/opencode_mesh_bridge.py"
    dest: /data/ai/helper-scripts/opencode_mesh_bridge.py
    owner: root
    group: root
    mode: "0700"
  register: mesh_bridge_source

- name: Configure narrow mesh bridge
  ansible.builtin.copy:
    dest: /data/ai/helper-scripts/config/opencode-mesh-bridge.json
    owner: root
    group: root
    mode: "0600"
    content: >-
      {{ {'pipeline': '/data/ai/helper-scripts/llama_mesh_pipeline.py',
          'state': '/data/ai/helper-scripts/state/opencode-mesh-bridge',
          'socket': opencode_agent_v2_canary_home_path ~ '/.config/opencode/mesh-bridge/bridge.sock',
          'uid': opencode_agent_run_uid | int,
          'additional_uids': opencode_agent_mesh_additional_uids,
          'checkpoint_databases': opencode_agent_mesh_checkpoint_databases,
          'gid': opencode_agent_run_gid | int} | to_nice_json }}
  register: mesh_bridge_config

- name: Install authorized mesh bridge unit
  ansible.builtin.template:
    src: opencode-mesh-bridge.service.j2
    dest: /etc/systemd/system/watoom-opencode-mesh-bridge.service
    owner: root
    group: root
    mode: "0644"
  register: mesh_bridge_unit

- name: Start narrow bridge without touching pipeline workers
  ansible.builtin.systemd_service:
    name: watoom-opencode-mesh-bridge
    daemon_reload: "{{ mesh_bridge_unit.changed }}"
    enabled: true
    state: "{{ 'restarted' if mesh_bridge_source.changed or mesh_bridge_config.changed or mesh_bridge_unit.changed else 'started' }}"

- name: Install mesh MCP adapter in existing tool directory
  ansible.builtin.copy:
    src: "{{ role_path }}/../llm-model-lab/files/watoom-llama-mesh.py"
    dest: "{{ opencode_agent_v2_canary_home_path }}/.config/opencode/watoom-tools/watoom-llama-mesh.py"
    owner: "{{ opencode_agent_run_uid }}"
    group: "{{ opencode_agent_run_gid }}"
    mode: "0755"

- name: Ensure dedicated native mesh skill directory
  ansible.builtin.file:
    path: "{{ opencode_agent_v2_canary_home_path }}/.config/opencode/skills/watoom-llama-mesh"
    state: directory
    owner: "{{ opencode_agent_run_uid }}"
    group: "{{ opencode_agent_run_gid }}"
    mode: "0755"

- name: Install mesh skill through supported native discovery directory
  ansible.builtin.copy:
    src: v2-native/skills/watoom-llama-mesh/SKILL.md
    dest: "{{ opencode_agent_v2_canary_home_path }}/.config/opencode/skills/watoom-llama-mesh/SKILL.md"
    owner: "{{ opencode_agent_run_uid }}"
    group: "{{ opencode_agent_run_gid }}"
    mode: "0644"

- name: Label only new files using existing SELinux mappings
  ansible.builtin.command:
    argv:
      - restorecon
      - -RFv
      - "{{ opencode_agent_v2_canary_home_path }}/.config/opencode/mesh-bridge"
      - "{{ opencode_agent_v2_canary_home_path }}/.config/opencode/watoom-tools/watoom-llama-mesh.py"
      - "{{ opencode_agent_v2_canary_home_path }}/.config/opencode/skills/watoom-llama-mesh"
  register: mesh_bridge_labels
  changed_when: mesh_bridge_labels.stdout | trim | length > 0

- name: Read existing canary configuration preserving other MCP services
  no_log: true
  ansible.builtin.command:
    argv: [kubectl, -n, opencode, get, configmap, opencode-v2-canary-config, -o, json]
  register: mesh_existing_cm
  changed_when: false

- name: Prepare only mesh MCP registration
  no_log: true
  ansible.builtin.set_fact:
    mesh_existing_config: "{{ (mesh_existing_cm.stdout | from_json).data['opencode.json'] | from_json }}"
    mesh_mcp_config:
      type: local
      command: [/usr/bin/python3, /home/opencode/.config/opencode/watoom-tools/watoom-llama-mesh.py, mcp]
      disabled: false
      codemode: true
      timeout: {startup: 30000, catalog: 30000, execution: 3600000}

- name: Prepare merged mesh configuration
  no_log: true
  ansible.builtin.set_fact:
    mesh_registered_config: >-
      {{ mesh_existing_config | combine({'mcp':
         (mesh_existing_config.mcp | dict2items | rejectattr('key', 'equalto', 'watoom-llama-mesh') | items2dict) | combine({'servers': (mesh_existing_config.mcp.servers | default({})) | combine({'watoom-llama-mesh': mesh_mcp_config})})}) }}

- name: Apply only changed MCP registration to existing ConfigMap
  no_log: true
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - opencode
      - patch
      - configmap
      - opencode-v2-canary-config
      - --type=merge
      - -p
      - "{{ {'data': {'opencode.json': mesh_registered_config | to_nice_json}} | to_json }}"
  register: mesh_registration_patch
  changed_when: mesh_registration_patch.rc == 0
  when: mesh_registered_config != mesh_existing_config


- name: Refresh subPath config mount after Mesh registration changes
  ansible.builtin.command:
    argv: [kubectl, -n, opencode, rollout, restart, deployment/opencode-v2-canary]
  when: mesh_registered_config != mesh_existing_config
  changed_when: true

- name: Verify canary rollout after Mesh registration
  ansible.builtin.command:
    argv: [kubectl, -n, opencode, rollout, status, deployment/opencode-v2-canary, --timeout=180s]
  changed_when: false
