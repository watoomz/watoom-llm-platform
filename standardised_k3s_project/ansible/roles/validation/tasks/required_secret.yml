---
- name: "Secret {{ validation_secret_target.namespace }}/{{ validation_secret_target.name }} | Query"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ validation_secret_target.namespace }}"
    name: "{{ validation_secret_target.name }}"
    kubeconfig: "{{ k3s_kubeconfig }}"
  register: validation_secret_query
  changed_when: false
  no_log: true

- name: "Secret {{ validation_secret_target.namespace }}/{{ validation_secret_target.name }} | Record missing state"
  ansible.builtin.set_fact:
    missing_kubernetes_secrets: >-
      {{
        missing_kubernetes_secrets
        + [validation_secret_target]
      }}
  when: validation_secret_query.resources | length == 0
  no_log: true
