# Operations run on the Bazzite worker (8 GiB, 6 CPUs, 600 s; tools/watoom-code/game_bazzite.py) instead of the
# homelab. If Bazzite cannot start the request stays QUEUED and is retried: the local route parks the production model
# (reserve_headroom) so it is off by default (owner policy 2026-11-07: Bazzite first, then the rig, never this server).
# The rig stage is retired (tools/rig-async-stage/README.md); reviving it is a separate owner decision. Captures use Xvfb/llvmpipe.
watoom_game_worker_bazzite_operations: [import, regression, capture, capture-scene, capture-p7, blender]
watoom_game_worker_local_fallback: false
# Root-owned mirror the dispatcher and its operator scripts run from (never the checkout); layout mirrors the repo because they resolve helpers relative to it
watoom_game_worker_release_root: /data/ai/helper-scripts/watoom-code/release

