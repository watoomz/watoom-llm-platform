---
watoom_code_namespace: watoom-code
watoom_code_root: /data/ai/watoom-code
# Application, Toolkit and AgentMemory image/source pins live only in ansible/vars/watoom-code.yml;
# the role fails closed without them.
# Owner-confirmed stable WatooM Code *application* context budget (the opencode compaction trigger),
# separate from each model's llama.cpp KV/backend capacity. Kept at 100000: lowering it only compacts
# sooner (extra summarisation cost) without reducing retained reasoning — opencode does NOT store or
# resend prior-turn reasoning/thinking (assistant messages persist only content/tool-calls/text), so
# reasoning is already ephemeral. Context growth comes from accumulated tool outputs/messages, not reasoning.
watoom_code_swift_context_tokens: 100000
# Per-step output budget (limit.output). Reasoning counts against it; 4096 truncated tool calls (finish=length).
watoom_code_model_output_tokens: 16384
# Reasoning levels selectable per message in the WatooM-Code GUI (model variant picker).
# The Qwen3.8 chat templates accept reasoning_effort xhigh|medium|low and enable_thinking=false;
# any other effort raises a template error, so only list models whose template was checked.
# CyberTiel's template has no effort levels and stays on its server default.
watoom_code_reasoning_models:
  - swift-qwen38-coder
  - qwen38-uncensored-mtp
  - mm-73306b413506f44b
# preserve_thinking:false (owner 2026-11-06) keeps the model thinking each turn but
# drops older turns' thinking from context instead of re-expanding the whole trace,
# so long sessions stay lean. enable_thinking:false ('off') disables thinking entirely.
watoom_code_reasoning_variants:
  - {id: xhigh, body: {reasoning_effort: xhigh, chat_template_kwargs: {preserve_thinking: false}}}
  - {id: medium, body: {reasoning_effort: medium, chat_template_kwargs: {preserve_thinking: false}}}
  - {id: low, body: {reasoning_effort: low, chat_template_kwargs: {preserve_thinking: false}}}
  - {id: "off", body: {chat_template_kwargs: {enable_thinking: false}}}
watoom_code_router_url: http://llm-router.llama-cpp.svc.cluster.local:8000/v1
watoom_code_apply: true
watoom_code_rollout_timeout: 180s


# Owner project groups (2026-10-29 layout): each <root>/<group>/<project> is mounted read-write
# into the app at the same path. Images keep their dedicated root below.
watoom_code_project_groups_root: /data/ai/projects
watoom_code_project_groups: [work, writing, games, homelab, llm]
# Dedicated writable image projects; the parent AI tree stays read-only.
watoom_code_image_projects_root: /data/ai/projects/images
watoom_code_image_output_root: /data/ai/projects/images/generated

# Project spaces shown in the new-session picker: existing projects are grouped under their space and
# creating a new project is guided by space. Rendered to {{ watoom_code_root }}/config/watoom-spaces.json
# (coordinator_guard.yml) and read by the app over /api config. Each space root is
# {{ watoom_code_project_groups_root }}/<id>; every id must be a configured group or the images root.
# Order here is the display order; the AGENTS.md group table is the source for labels and descriptions.
watoom_code_project_spaces:
  - {id: games, label: Games, description: "Game builds (Godot, Unreal)"}
  - {id: work, label: Work, description: "Employer work"}
  - {id: writing, label: Writing, description: "Stories and documents"}
  - {id: images, label: Images, description: "Image and render projects"}
  - {id: homelab, label: Homelab, description: "Homelab infrastructure"}
  - {id: llm, label: "LLM & tooling", description: "Model, agent and WatooM-Code tooling"}

watoom_code_kali_mcp_enabled: true
watoom_code_kali_mcp_url: http://watoom-kali-workbench-mcp.kali-agent.svc.cluster.local:8088/mcp

# Base egress NetworkPolicy for the watoom-code pod (DNS, agentmemory, toolkit, the model router,
# model-manager, the Kali MCP workbench, SearXNG, and the public internet except LAN/private ranges).
# Off by default: the namespace currently has no NetworkPolicy at all, so flipping this on for the
# first time is a real behaviour change, not a no-op redeploy, and should be done deliberately with
# the owner, not as a side effect of an unrelated change. When true, the three additive MCP egress
# rules below are also rendered automatically for whichever of the godot/ue/unreal MCP routes are
# enabled (never render an additive rule without this base policy: see the godot-mcp/ue-mcp READMEs).
watoom_code_egress_policy_enabled: false
# Nwiro Unreal MCP over the rig's reverse SSH tunnel (tools/rig-unreal-mcp). Off until the tunnel, proxy and egress policy are installed.
watoom_code_unreal_mcp_enabled: false
watoom_code_unreal_mcp_url: http://10.242.0.1:15354/mcp

# NPGameDev Godot MCP toolkit, reached by SSHing directly to a restricted, ForceCommand-only
# account on the rig (tools/rig-godot-mcp). Off until the rig's sshd, the router rule and the
# egress policy are installed. See that README: UNTESTED against the real editor/plugin/bridge.
watoom_code_godot_mcp_enabled: false
watoom_code_godot_mcp_host: 10.99.1.44
watoom_code_godot_mcp_port: 2223
watoom_code_godot_mcp_user: godotmcp

# db-lyon ue-mcp (Unreal Engine), reached the same way through its own restricted account and policy wrapper
# (tools/rig-ue-mcp). Off until the rig side, the router rule and the egress policy are installed; the rig steps are in
# that README. UNTESTED on the rig and against the real ue-mcp server.
watoom_code_ue_mcp_enabled: false
