watoom_code_gpu_observability_enabled: true
watoom_code_gpu_observability_root: /data/ai/helper-scripts/state/gpu-controller-observability

# Qualified RIG route; existing admitted host captures retain their worker.
watoom_asset_capture_workstation_enabled: true
# Mount /config read-only into the app so agents cannot rewrite their guard, agents or
# permissions (Ansible remains the writer). Enable only after a candidate confirms no
# runtime writer (e.g. Settings UI saves) depends on it.
watoom_code_config_read_only: false
# Hybrid BM25 + vector recall in AgentMemory through the GPU-resident BGE service
# (playbooks/llm-bge-embeddings.yml). Off restores BM25-only recall; stored memories are unchanged.
watoom_code_memory_embeddings: false
watoom_code_memory_embedding_url: http://bge-embeddings.llama-cpp.svc.cluster.local:8000
# Shared by resources.json.j2 and playbooks/watoom-code-memory-embeddings.yml.
watoom_code_memory_embedding_env:
  - {name: EMBEDDING_PROVIDER, value: openai}
  - {name: OPENAI_EMBEDDING_BASE_URL, value: "{{ watoom_code_memory_embedding_url }}"}
  - {name: OPENAI_EMBEDDING_API_KEY, value: internal-no-auth}
  - {name: OPENAI_EMBEDDING_MODEL, value: bge-small-en-v1.5}
  - {name: OPENAI_EMBEDDING_DIMENSIONS, value: "384"}
  - {name: OPENAI_API_KEY_FOR_LLM, value: "false"}
  - {name: AGENTMEMORY_LLM_TIMEOUT_MS, value: "15000"}
  - {name: REBUILD_EMBED_BATCH_SIZE, value: "32"}
# Routes the WatooM-Code server cannot observe itself; profile availability reads them from
# {{ watoom_code_root }}/config/watoom-routes.json (only known profile dependency names count).
#   unreal-editor: game-worker unreal-export (export_pack.py, Bazzite first)
#   avian-approved-compatible-runtime: Toolkit generator asset-assistant.avian
#   blender: game-worker blender operation (qualified server-cpu Blender 5.2.1)
watoom_code_declared_routes:
  - unreal-editor
  - avian-approved-compatible-runtime
  - blender
