---
# Resends a one-time follow-up resume prompt when a game project's worker job finished (pass or fail) and
# the coordinator session never got the bridge's own single-shot notification -- see
# tools/watoom-code/game_session_watchdog.py for why that notification can go unanswered. Report-only beyond
# that one safe, idempotent action; never runs fenced recovery, never switches a model lease.
#
# Runs from the same root-owned release mirror as watoom-game-worker.service (game_worker.yml), not a
# standalone copy: this script imports the sibling maintenance_guard.py, and a lone copy of it elsewhere
# left every run failing with ModuleNotFoundError (the exact class of bug game_worker.yml's own release
# mirror comment already warns about). game_worker.yml's sync task mirrors the whole tools/watoom-code/
# directory -- including this script -- so it must run before this file is imported.
- name: Install game session watchdog timer
  vars:
    watoom_game_session_watchdog_script: "{{ watoom_game_worker_release_root }}/standardised_k3s_project/tools/watoom-code/game_session_watchdog.py"
  ansible.builtin.copy:
    dest: /etc/systemd/system/watoom-game-session-watchdog.service
    mode: '0644'
    content: |
      [Unit]
      Description=Resend a lost game-worker resume notification, report on a stuck request
      [Service]
      Type=oneshot
      ExecStart=/usr/bin/python3 {{ watoom_game_session_watchdog_script }} --report /data/ai/helper-scripts/reports/game-session-watchdog
      Nice=15
      CPUQuota=50%
      MemoryMax=256M
      MemorySwapMax=0
      RuntimeMaxSec=120
      TimeoutStopSec=10
      KillMode=control-group
  register: watoom_game_session_watchdog_service_unit
- name: Install game session watchdog schedule
  ansible.builtin.copy:
    dest: /etc/systemd/system/watoom-game-session-watchdog.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Check every game project's most recent worker job every 20 minutes
      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=20min
      Unit=watoom-game-session-watchdog.service
      [Install]
      WantedBy=timers.target
  register: watoom_game_session_watchdog_timer_unit
- name: Enable game session watchdog
  ansible.builtin.systemd_service:
    name: watoom-game-session-watchdog.timer
    state: "{{ 'restarted' if watoom_game_session_watchdog_timer_unit is changed else 'started' }}"
    enabled: true
    daemon_reload: "{{ watoom_game_session_watchdog_service_unit.changed or watoom_game_session_watchdog_timer_unit.changed }}"
