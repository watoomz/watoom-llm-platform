---
- name: Install immutable coordinator guard
  ansible.builtin.include_tasks: coordinator_guard.yml
- name: Install explicit role boundaries for every managed agent
  # Same transform AND same file set as native_agents.yml's "Install managed agents" task, deliberately: this
  # playbook exists to reapply (not diverge from) that result under an idle guard, without a full redeploy.
  # The delegation rules are shared across the whole roster and the coordinator guard routes to all of it, so
  # redeploying only some agents would leave the rest on stale rules. Keeping both copies in lockstep stops the
  # two playbooks from flapping these files to two different byte-for-byte contents.
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', item) | regex_replace('(?m)^model:\\n  providerID: watoom\\n  model: [A-Za-z0-9_.-]+\\n', '') }}"
    dest: '{{ watoom_code_root }}/config/agents/{{ item | basename }}'
    owner: '1001'
    group: '1001'
    mode: '0644'
  loop: "{{ query('ansible.builtin.fileglob', role_path ~ '/../watoom-code/files/native/agents/*.md') }}"
