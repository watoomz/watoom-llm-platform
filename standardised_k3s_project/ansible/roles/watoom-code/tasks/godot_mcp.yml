---
# Merge (or, when disabled, remove) only the watoom-godot MCP entry in the existing user configuration.
# The opencode.json template is seed-only (force: false), so enabling this integration needs this task.
# Credentials are staged separately by playbooks/godot-mcp-ssh.yml; see tools/rig-godot-mcp/README.md.
- name: Maintain the maintained Godot MCP entry in existing native configuration
  ansible.builtin.script:
    cmd: >-
      enable-godot-mcp.py {{ watoom_code_root }}/config/opencode.json
      {{ (watoom_code_godot_mcp_host ~ ' ' ~ watoom_code_godot_mcp_port ~ ' ' ~ watoom_code_godot_mcp_user)
         if (watoom_code_godot_mcp_enabled | bool) else '-' }}
    executable: /usr/bin/python3
  register: watoom_code_godot_mcp
  changed_when: "watoom_code_godot_mcp.stdout | trim == 'CHANGED'"
  tags: [godot_mcp]
