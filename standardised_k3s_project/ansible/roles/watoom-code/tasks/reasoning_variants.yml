---
- name: Offer xhigh, medium, low and off reasoning variants without replacing user settings
  ansible.builtin.script:
    cmd: >-
      enable-reasoning-variants.py {{ watoom_code_root }}/config/opencode.json
      {{ {'models': watoom_code_reasoning_models, 'variants': watoom_code_reasoning_variants} | to_json | quote }}
    executable: /usr/bin/python3
  register: watoom_code_reasoning_variants_result
  changed_when: "'CHANGED' == watoom_code_reasoning_variants_result.stdout | trim"
- name: Record the reasoning variant spec for the Model Manager broker, which re-applies it after any registration
  ansible.builtin.copy:
    dest: "{{ watoom_code_root }}/config/reasoning-variants.json"
    content: "{{ {'models': watoom_code_reasoning_models, 'variants': watoom_code_reasoning_variants} | to_json }}\n"
    owner: root
    group: root
    mode: "0644"
