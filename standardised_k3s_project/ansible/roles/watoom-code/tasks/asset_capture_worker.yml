---
- name: Require scoped release admission
  ansible.builtin.assert:
    that: watoom_render_routing_guard_held | default(false) | bool
- name: Provision app-writable capture request parent only
  ansible.builtin.file:
    path: /data/ai/projects/images/.opencode/capture-jobs
    state: directory
    owner: '1001'
    group: '1001'
    mode: '0755'
- name: Provision capture parent shared by app and existing worker group
  ansible.builtin.file:
    path: /data/ai/projects/images/.opencode/captures
    state: directory
    owner: '1001'
    group: '1009'
    mode: '2775'
- name: Configure external declarative Blender capture worker
  ansible.builtin.copy:
    dest: /etc/watoom-asset-capture.json
    owner: root
    group: root
    mode: '0644'
    content: >-
      {{ {'projects': ['/data/ai/projects/images'],
          'source_roots': ['/data/ai/assets'],
          'blender': '/data/ai/toolchains/blender/5.2.1/blender-5.2.1-linux-x64/blender',
          'blender_sha256': 'c2fd82553c979a7f6ba85202c487aa1173c90db588a67d74d70cc7b0c2bea01c',
          'ffmpeg': '/usr/sbin/ffmpeg',
          'workstation_enabled': watoom_asset_capture_workstation_enabled | default(false) | bool} | to_nice_json }}
