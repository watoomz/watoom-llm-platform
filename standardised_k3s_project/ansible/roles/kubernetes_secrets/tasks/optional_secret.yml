---
- name: "Secret {{ kubernetes_secret_target.namespace }}/{{ kubernetes_secret_target.name }} | Reconcile optional Secret"
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ kubernetes_secret_target.name }}"
        namespace: "{{ kubernetes_secret_target.namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
      type: Opaque
      stringData: >-
        {{
          dict(
            kubernetes_secret_target.data.keys()
            | zip(
                kubernetes_secret_target.data.values()
                | map('extract', kubernetes_secret_environment)
              )
          )
        }}
  no_log: true
