---
- name: "Homelab Rebuild Host Health | Validate host"
  ansible.builtin.include_role:
    name: host_health

- name: "Homelab Rebuild Storage | Gather filesystem usage"
  ansible.builtin.command:
    argv:
      - df
      - -h
      - /
      - /app
      - /data
  register: homelab_health_df
  changed_when: false
  failed_when: false

- name: "Homelab Rebuild Storage | Report filesystem usage"
  ansible.builtin.debug:
    var: homelab_health_df.stdout_lines
