---
- name: "Homelab Rebuild | Disable systemd-resolved stub listener"
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/disable-stub-listener.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Resolve]
      DNSStubListener=no
  notify: "Service systemd-resolved | Restart"

- name: "Homelab Rebuild | Point resolv.conf at systemd resolved runtime file"
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  notify: "Service systemd-resolved | Restart"
