---
- name: Derive exact image-scope source version
  ansible.builtin.set_fact:
    watoom_code_image_scope_hash: "{{ lookup('ansible.builtin.file', role_path + '/files/image-scope/index.js', rstrip=false) | hash('sha256') }}"
- name: Install versioned native image-scope transport guard
  ansible.builtin.copy:
    src: image-scope/
    dest: "{{ watoom_code_root }}/config/watoom-tools/image-scope-{{ watoom_code_image_scope_hash }}/"
    owner: '1001'
    group: '1001'
    mode: '0644'
    directory_mode: '0750'
- name: Select native image-scope package without replacing user configuration
  ansible.builtin.script:
    cmd: enable-image-scope.py {{ watoom_code_root }}/config/opencode.json /config/watoom-tools/image-scope-{{ watoom_code_image_scope_hash }}
    executable: /usr/bin/python3
  register: watoom_code_image_scope
  changed_when: "'CHANGED' == watoom_code_image_scope.stdout | trim"
