---
- name: Create writable common image review directory
  ansible.builtin.file:
    path: '{{ watoom_code_image_projects_root }}/review'
    state: directory
    owner: '1001'
    group: '1001'
    mode: '0775'
- name: Install central image review collector
  ansible.builtin.copy:
    src: image-review-collect.py
    dest: /data/ai/helper-scripts/image-review-collect.py
    owner: root
    group: root
    mode: '0755'
- name: Install central image review service
  ansible.builtin.copy:
    dest: /etc/systemd/system/watoom-image-review.service
    content: |
      [Unit]
      Description=Copy project captures to shared image review directory
      [Service]
      Type=oneshot
      ExecStart=/usr/bin/python3 /data/ai/helper-scripts/image-review-collect.py
      Nice=15
      CPUQuota=25%
      MemoryMax=192M
      UMask=0022
- name: Install central image review timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/watoom-image-review.timer
    content: |
      [Unit]
      Description=Collect project captures every minute
      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=1min
      Persistent=true
      [Install]
      WantedBy=timers.target
- name: Enable central image review collection
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: watoom-image-review.timer
    enabled: true
    state: started
