apiVersion: v1
kind: ServiceAccount
metadata:
  name: glance-helper
  namespace: glance
  labels:
    app.kubernetes.io/name: glance
    app.kubernetes.io/component: helper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glance-helper-read
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glance-helper-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: glance-helper-read
subjects:
  - kind: ServiceAccount
    name: glance-helper
    namespace: glance
