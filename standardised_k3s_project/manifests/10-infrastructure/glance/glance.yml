        \        color: var(--color-text-subdue) !important;\n        font-size: .72rem !important;\n      }\n\n      .ops-table {\n        display: grid !important;\n        gap: 6px !important;\n      }\n\n      .ops-table-row {\n        display: grid !important;\n        grid-template-columns: minmax(170px, 1.5fr) repeat(3, minmax(72px, .6fr)) !important;\n        gap: 8px !important;\n        align-items: center !important;\n        padding: 8px 10px !important;\n        min-width: 0 !important;\n      }\n\n      .ops-table-row.head {\n        background: rgba(255,255,255,0.07) !important;\n        color: var(--color-text-subdue) !important;\n        font-size: .7rem !important;\n        font-weight: 900 !important;\n        text-transform: uppercase !important;\n      }\n\n      .ops-table-row.warn {\n        border-color: rgba(255,190,90,0.4) !important;\n        background: rgba(255,190,90,0.07) !important;\n      }\n\n      .ops-table-row span {\n        min-width: 0 !important;\n  \
        \      overflow: hidden !important;\n        text-overflow: ellipsis !important;\n        white-space: nowrap !important;\n      }\n\n      .ops-table.compact .ops-table-row {\n        grid-template-columns: minmax(130px, 1.4fr) repeat(3, minmax(55px, .6fr)) !important;\n      }\n\n    \n      .home-overview {\n        display: grid !important;\n        gap: 10px !important;\n      }\n\n      .home-hero {\n        border: 1px solid var(--color-separator) !important;\n        border-radius: 8px !important;\n        padding: 14px !important;\n        background: rgba(255,255,255,0.045) !important;\n      }\n\n      .home-hero span,\n      .home-grid span {\n        display: block !important;\n        color: var(--color-text-subdue) !important;\n        font-size: .72rem !important;\n      }\n\n      .home-hero b {\n        display: block !important;\n        margin-top: 4px !important;\n        font-size: 1.6rem !important;\n        color: var(--color-text-highlight) !important;\n    \
        \  }\n\n      .home-hero small,\n      .home-grid small {\n        display: block !important;\n        margin-top: 3px !important;\n        color: var(--color-text-subdue) !important;\n        font-size: .72rem !important;\n      }\n\n      .home-grid {\n        display: grid !important;\n        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)) !important;\n        gap: 8px !important;\n      }\n\n      .home-grid div,\n      .store-row {\n        border: 1px solid var(--color-separator) !important;\n        border-radius: 8px !important;\n        padding: 9px 10px !important;\n        background: rgba(255,255,255,0.035) !important;\n      }\n\n      .home-grid b {\n        display: block !important;\n        overflow: hidden !important;\n        text-overflow: ellipsis !important;\n        white-space: nowrap !important;\n        color: var(--color-text-highlight) !important;\n      }\n\n      .store-columns {\n        display: grid !important;\n        grid-template-columns:\
        \ repeat(3, minmax(0, 1fr)) !important;\n        gap: 12px !important;\n      }\n\n      .store-columns.two {\n        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;\n      }\n\n      .store-row {\n        display: block !important;\n        margin-bottom: 7px !important;\n        text-decoration: none !important;\n      }\n\n      .store-row b {\n        display: block !important;\n        overflow: hidden !important;\n        text-overflow: ellipsis !important;\n        white-space: nowrap !important;\n        color: var(--color-text-highlight) !important;\n      }\n\n      .store-row span {\n        display: block !important;\n        margin-top: 3px !important;\n        color: var(--color-text-subdue) !important;\n        font-size: .72rem !important;\n      }\n\n      .game-status-table a.ops-table-row {\n        text-decoration: none !important;\n      }\n\n      @media (max-width: 900px) {\n        .store-columns,\n        .store-columns.two,\n        .store-columns.three\
        \ {\n          grid-template-columns: 1fr !important;\n        }\n      }\n\n    </style>\n    <style>\n      /* WatooM sci-fi layer: shares the guide palette (site.css). */\n      body {\n        background-image: linear-gradient(rgba(63,214,255,.022) 1px, transparent 1px), linear-gradient(90deg, rgba(63,214,255,.022) 1px, transparent 1px) !important;\n        background-size: 32px 32px !important;\n      }\n      .widget-header {\n        font-family: ui-monospace, JetBrains Mono, SFMono-Regular, Consolas, monospace !important;\n        letter-spacing: .16em !important;\n        text-transform: uppercase !important;\n        font-size: .72rem !important;\n      }\n      .widget-header::before {\n        content: '// ';\n        color: var(--color-primary);\n        opacity: .7;\n      }\n      .widget-content:not(.widget-content-frameless) {\n        border: 1px solid rgba(63,214,255,.10) !important;\n        box-shadow: inset 0 1px 0 rgba(63,214,255,.14) !important;\n      }\n      .header-container .logo {\n        font-family: ui-monospace, JetBrains Mono, SFMono-Regular, Consolas, monospace !important;\n        letter-spacing: .2em !important;\n      }\n      .nav-item.nav-item-current, .nav-item:hover {\n        text-shadow: 0 0 12px rgba(63,214,255,.35);\n      }\n    </style>\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: glance
  labels:
    app.kubernetes.io/name: glance
    app.kubernetes.io/part-of: glance
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      labels:
        app: glance
        app.kubernetes.io/name: glance
        app.kubernetes.io/part-of: glance
    spec:
      automountServiceAccountToken: true
      containers:
      - name: glance
        image: glanceapp/glance:v0.8.5
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8099
        envFrom:
        - secretRef:
            name: glance-secrets
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /app/config/glance.yml
          subPath: glance.yml
        readinessProbe:
          httpGet:
            path: /
            port: 8099
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /
            port: 8099
          initialDelaySeconds: 30
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      - name: helper-api
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        command:
        - python
        - /app/helper.py
        ports:
        - name: helper
          containerPort: 9000
        envFrom:
        - secretRef:
            name: glance-secrets
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 320Mi
        volumeMounts:
        - name: helper
          mountPath: /app/helper.py
          subPath: helper.py
        - name: guide
          mountPath: /app/guide
          readOnly: true
        - name: command-center
          mountPath: /app/command-center
          readOnly: true
        - name: worker-status
          mountPath: /app/worker-status
          readOnly: true
        - name: change-requests
          mountPath: /app/change-requests
        - name: break-glass
          mountPath: /app/break-glass
        readinessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 15
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 20
          periodSeconds: 30
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: GLANCE_GUIDE_ROOT
          value: /app/guide
        - name: CC_ASSET_ROOT
          value: /app/command-center
        - name: WORKER_STATUS_FILE
          value: /app/worker-status/workers.json
        - name: CC_CR_STATE
          value: /app/change-requests
        - name: CC_BG_STATE
          value: /app/break-glass
        - name: CC_CR_PIN_HASH
          valueFrom:
            secretKeyRef:
              name: glance-change-approval
              key: pin-hash
              optional: true
      volumes:
      - name: config
        configMap:
          name: glance-config
      - name: helper
        configMap:
          name: glance-helper
      - name: guide
        hostPath:
          path: /data/github/watoom-standardised-homelab/standardised_k3s_project/config/glance/guide
          type: Directory
      - name: command-center
        hostPath:
          path: /data/github/watoom-standardised-homelab/standardised_k3s_project/config/glance/command-center
          type: Directory
      - name: worker-status
        hostPath:
          path: /data/ai/helper-scripts/state/worker-status
          type: DirectoryOrCreate
      - name: change-requests
        hostPath:
          path: /data/ai/helper-scripts/state/change-requests
          type: DirectoryOrCreate
      - name: break-glass
        hostPath:
          path: /data/ai/helper-scripts/state/break-glass
          type: DirectoryOrCreate
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: glance-helper
---
apiVersion: v1
kind: Service
metadata:
  name: glance
  namespace: glance
  labels:
    app.kubernetes.io/name: glance
    app.kubernetes.io/part-of: glance
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app: glance
  ports:
  - name: http
    port: 8099
    targetPort: 8099
  - name: helper-web
    port: 9000
    targetPort: 9000
    protocol: TCP
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: glance
  namespace: glance
  labels:
    app.kubernetes.io/name: glance
    app.kubernetes.io/part-of: glance
    app.kubernetes.io/managed-by: kubectl
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`glance.internal.homelab.example`) && (PathPrefix(`/guide`) || PathPrefix(`/guide-api`) || PathPrefix(`/command-center`) || PathPrefix(`/cc`))
    priority: 100
    services:
    - name: glance
      port: 9000
      nativeLB: true
  - kind: Rule
    match: Host(`glance.internal.homelab.example`)
    priority: 10
    services:
    - name: glance
      port: 8099
      nativeLB: true
  tls:
    secretName: watoom-tls
