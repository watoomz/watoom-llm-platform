    - name: Hub
      width: wide
      columns:
      - size: full
        widgets:
        - type: html
          source: |
            <div style="line-height:1.55">
            <h3>How to reach each tool</h3>
            <p><b>MOSS Image Studio</b> opens in your browser (below). Press <i>Start GPU session</i> first: it starts as soon as WatooM Code is not running anything, then pauses the LLM, and restores it after 10 idle minutes or when you press End.</p>
            <p><b>LLaMA-Mesh</b> has no web page. You use it by asking WatooM Code for a 3D mesh (its <i>watoom-llama-mesh</i> tool) or from the host with <code>scripts/llama-mesh</code>. Finished meshes are written to <code>/data/ai/assets/generated/llama-mesh/</code>. Like MOSS, it takes the GPU through the GPU controller.</p>
            <p><b>Everything else</b> is linked below. Only one GPU job runs at a time: the LLM, Mesh and MOSS take turns.</p>
            </div>
