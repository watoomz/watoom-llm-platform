apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-kubelet-scrape
  labels:
    app.kubernetes.io/name: prometheus-kubelet-scrape
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: kubectl
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/metrics
  - nodes/proxy
  - pods
  - pods/proxy
  - services
  - endpoints
  verbs:
  - get
  - list
  - watch
- nonResourceURLs:
  - /metrics
  - /metrics/cadvisor
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-kubelet-scrape
  labels:
    app.kubernetes.io/name: prometheus-kubelet-scrape
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: kubectl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-kubelet-scrape
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\n  evaluation_interval: 15s\nrule_files:\n- /etc/prometheus/alert-rules.yml\n\
    - /etc/prometheus/rules/*.yml\nscrape_configs:\n- job_name: prometheus\n  static_configs:\n  - targets:\n\
    \    - localhost:9090\n- job_name: node-exporter\n  static_configs:\n  - targets:\n    - 10.99.20.225:9100\n- job_name:\
    \ router-snmp\n  scrape_interval: 60s\n  scrape_timeout: 20s\n  metrics_path: /snmp\n  params:\n    auth:\n    - public_v2\n\
    \    module:\n    - if_mib\n  static_configs:\n  - targets:\n    - 10.99.20.1\n    labels:\n      device: router-router\n\
    \  relabel_configs:\n  - source_labels:\n    - __address__\n    target_label: __param_target\n  - source_labels:\n   \
    \ - __param_target\n    target_label: instance\n  - target_label: __address__\n    replacement: snmp-exporter.monitoring.svc.cluster.local:9116\n\
    - job_name: snmp-exporter\n  static_configs:\n  - targets:\n    - snmp-exporter.monitoring.svc.cluster.local:9116\n- job_name:\
    \ mktxp\n  scrape_interval: 60s\n  scrape_timeout: 30s\n  static_configs:\n  - targets:\n    - mktxp.monitoring.svc.cluster.local:49090\n\
    - job_name: loki\n  static_configs:\n  - targets:\n    - loki.monitoring.svc.cluster.local:3100\n- job_name: vector-router-syslog\n\
    \  static_configs:\n  - targets:\n    - vector-router-syslog.monitoring.svc.cluster.local:9598\n- job_name: kube-state-metrics\n\
    \  static_configs:\n  - targets:\n    - kube-state-metrics.monitoring.svc.cluster.local:8080\n- job_name: dcgm-exporter\n\
    \  scrape_interval: 15s\n  static_configs:\n  - targets:\n    - dcgm-exporter.monitoring.svc.cluster.local:9400\n- job_name:\
    \ llama-cpp\n  scrape_interval: 15s\n  metrics_path: /metrics\n  kubernetes_sd_configs:\n  - role: service\n    namespaces:\n\
    \      names:\n      - llama-cpp\n  relabel_configs:\n  - source_labels:\n    - __meta_kubernetes_service_name\n    regex:\
    \ llama-cpp-.+\n    action: keep\n  - source_labels:\n    - __meta_kubernetes_service_port_name\n    regex: http\n   \
    \ action: keep\n  - source_labels:\n    - __meta_kubernetes_service_name\n    target_label: service\n  - source_labels:\n\
    \    - __meta_kubernetes_service_name\n    regex: llama-cpp-(.+)\n    target_label: model\n    replacement: $1\n  - target_label:\
    \ runtime\n    replacement: llama.cpp\n  - target_label: gpu\n    replacement: rtx-3080\n- job_name: llama-perf\n  scrape_interval:\
    \ 15s\n  metrics_path: /metrics\n  static_configs:\n  - targets:\n    - platform-workers.platform-workers.svc.cluster.local:9599\n\
    \  relabel_configs:\n  - target_label: runtime\n    replacement: llama.cpp\n  - target_label: exporter\n    replacement:\
    \ vector\n  - target_label: source\n    replacement: llama-server-logs\n\n- job_name: moss-image\n  scrape_interval: 15s\n  metrics_path: /metrics\n  static_configs:\n  - targets:\n    - 10.242.0.1:8791\n  relabel_configs:\n  - target_label: service\n    replacement: moss-image\n\n- job_name: kubernetes-cadvisor\n  scheme: https\n\
    \  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n  tls_config:\n    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n\
    \  kubernetes_sd_configs:\n  - role: node\n  relabel_configs:\n  - target_label: __address__\n    replacement: kubernetes.default.svc:443\n\
    \  - source_labels:\n    - __meta_kubernetes_node_name\n    regex: (.+)\n    target_label: __metrics_path__\n    replacement:\
    \ /api/v1/nodes/${1}/proxy/metrics/cadvisor\n\n- job_name: watoom-opencode-observability\n\n  scrape_interval: 15s\n\n\
    \  scrape_timeout: 10s\n\n  metrics_path: /metrics\n\n  scheme: http\n\n  static_configs:\n\n    - targets:\n\n      \
    \  - watoom-opencode-observability.monitoring.svc.cluster.local:9108\n\n      labels:\n\n        namespace: monitoring\n\
    \n        service: watoom-opencode-observability\n\n\n- job_name: kubernetes-pods-traefik\n  scheme: https\n  bearer_token_file:\
    \ /var/run/secrets/kubernetes.io/serviceaccount/token\n  tls_config:\n    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n\
    \  kubernetes_sd_configs:\n  - role: pod\n  relabel_configs:\n  - source_labels:\n    - __meta_kubernetes_namespace\n\
    \    action: keep\n    regex: kube-system\n  - source_labels:\n    - __meta_kubernetes_pod_label_app_kubernetes_io_name\n\
    \    action: keep\n    regex: traefik\n  - source_labels:\n    - __meta_kubernetes_pod_annotation_prometheus_io_scrape\n\
    \    action: keep\n    regex: \"true\"\n  - target_label: __address__\n    replacement: kubernetes.default.svc:443\n \
    \ - source_labels:\n    - __meta_kubernetes_namespace\n    - __meta_kubernetes_pod_name\n    - __meta_kubernetes_pod_annotation_prometheus_io_port\n\
    \    action: replace\n    regex: (.+);(.+);(.+)\n    target_label: __metrics_path__\n    replacement: /api/v1/namespaces/${1}/pods/${2}:${3}/proxy/metrics\n\
    \  - source_labels:\n    - __meta_kubernetes_pod_name\n    target_label: pod\n"
  alert-rules.yml: "groups:\n- name: watoom-node-health\n  rules:\n  - alert: WatoomNodeExporterDown\n    expr: up{job=\"\
    node-exporter\"} == 0\n    for: 2m\n    labels:\n      severity: critical\n    annotations:\n      summary: \"Node exporter\
    \ is down\"\n      description: \"Prometheus cannot scrape node-exporter on the homelab server.\"\n  - alert: WatoomRootDiskHigh\n\
    \    expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"\
    /\",fstype!~\"tmpfs|overlay\"}) > 85\n    for: 10m\n    labels:\n      severity: warning\n    annotations:\n      summary:\
    \ \"Root filesystem above 85%\"\n      description: \"The root filesystem is getting full. Check old packages, logs, and\
    \ container images.\"\n  - alert: WatoomAppDiskHigh\n    expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/app\"\
    ,fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/app\",fstype!~\"tmpfs|overlay\"}) > 85\n    for:\
    \ 10m\n    labels:\n      severity: warning\n    annotations:\n      summary: \"/app filesystem above 85%\"\n      description:\
    \ \"Application config/state storage is getting full.\"\n  - alert: WatoomDataDiskHigh\n    expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint=\"\
    /data\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/data\",fstype!~\"tmpfs|overlay\"}) > 85\n\
    \    for: 10m\n    labels:\n      severity: warning\n    annotations:\n      summary: \"/data filesystem above 85%\"\n\
    \      description: \"Media/data storage is getting full. Plan cleanup or NAS expansion.\"\n  - alert: WatoomNodeLoadHigh\n\
    \    expr: node_load15 / count without (cpu, mode) (node_cpu_seconds_total{mode=\"idle\"}) > 2\n    for: 15m\n    labels:\n\
    \      severity: warning\n    annotations:\n      summary: \"Sustained high node load\"\n      description: \"15-minute\
    \ load average is more than twice the CPU core count.\"\n  - alert: WatoomMemoryLow\n    expr: node_memory_MemAvailable_bytes\
    \ / node_memory_MemTotal_bytes < 0.10\n    for: 10m\n    labels:\n      severity: warning\n    annotations:\n      summary:\
    \ \"Available memory below 10%\"\n      description: \"The server is low on available memory.\"\n  - alert: WatoomWorkerSnapshotStale\n    expr: time() - watoom_worker_snapshot_timestamp_seconds > 300\n    for: 2m\n    labels:\n      severity: warning\n    annotations:\n      summary: \"Worker status snapshot is stale\"\n      description: \"The worker collector has not refreshed its snapshot for more than five minutes.\"\n  - alert: WatoomBazziteDown\n    expr: watoom_worker_up{worker=\"bazzite\"} == 0\n    for: 10m\n    labels:\n      severity: warning\n    annotations:\n      summary: \"Bazzite worker is down\"\n      description: \"Bazzite has been unreachable for ten minutes.\"\n  - alert: WatoomWorkerJobStuck\n    expr: watoom_worker_running_job_seconds > (2 * watoom_worker_running_job_deadline_seconds)\n    for: 2m\n    labels:\n      severity: warning\n    annotations:\n      summary: \"Worker job exceeded twice its deadline\"\n      description: \"A worker job has been running for more than twice its prepared deadline.\"\n  - alert: WatoomWorkerFailureRateHigh\n    expr: (sum by (worker) (watoom_worker_jobs{state=\"failed\"}) / clamp_min(sum by (worker) (watoom_worker_jobs), 1)) > 0.5 and sum by (worker) (watoom_worker_jobs) >= 4\n    for: 10m\n    labels:\n      severity: warning\n    annotations:\n      summary: \"Worker failure rate is high\"\n      description: \"More than half of at least four jobs in the rolling 24-hour window failed.\"\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasources.yml: "apiVersion: 1\ndatasources:\n- name: Prometheus\n  type: prometheus\n  uid: prometheus\n  access: proxy\n\
    \  url: http://prometheus.monitoring.svc.cluster.local:9090\n  isDefault: true\n  editable: true\n- name: Loki\n  type:\
    \ loki\n  uid: loki\n  access: proxy\n  url: http://loki.monitoring.svc.cluster.local:3100\n  editable: true\n"
  dashboards.yml: "apiVersion: 1\nproviders:\n- name: WatooM\n  orgId: 1\n  folder: WatooM\n  type: file\n  disableDeletion:\
    \ false\n  editable: true\n  updateIntervalSeconds: 60\n  options:\n    path: /var/lib/grafana/dashboards\n"
