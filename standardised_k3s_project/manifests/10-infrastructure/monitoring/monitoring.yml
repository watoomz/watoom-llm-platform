    metadata:
      labels:
        app: snmp-exporter
        app.kubernetes.io/name: snmp-exporter
        app.kubernetes.io/part-of: monitoring
    spec:
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      containers:
      - image: docker.io/prom/snmp-exporter@sha256:272ff087c314fb1e384b7ba7e555f020cc0c072fb23f0dc1d1cb51b48067efdc
        imagePullPolicy: Always
        name: snmp-exporter
        ports:
        - containerPort: 9116
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
