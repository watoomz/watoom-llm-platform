apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: kubectl
  name: grafana
  namespace: monitoring
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: monitoring
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: GF_SECURITY_ADMIN_USER
              name: grafana-secrets
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: GF_SECURITY_ADMIN_PASSWORD
              name: grafana-secrets
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_SECURITY_ALLOW_EMBEDDING
          value: 'true'
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Viewer
        - name: GF_USERS_VIEWERS_CAN_EDIT
          value: 'false'
        - name: GF_SECURITY_COOKIE_SECURE
          value: 'true'
        - name: GF_SECURITY_COOKIE_SAMESITE
          value: lax
        - name: GF_SERVER_DOMAIN
          value: grafana.internal.homelab.example
        - name: GF_SERVER_ROOT_URL
          value: https://grafana.internal.homelab.example/
        image: docker.io/grafana/grafana@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
        imagePullPolicy: Always
        name: grafana
        ports:
        - containerPort: 3000
          protocol: TCP
        resources:
          limits:
            cpu: '2'
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/grafana
          name: grafana-data
        - mountPath: /etc/grafana/provisioning/datasources/datasources.yml
          name: grafana-provisioning
          subPath: datasources.yml
        - mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
          name: grafana-provisioning
          subPath: dashboards.yml
        - mountPath: /var/lib/grafana/dashboards/watoom-router-ifmib.json
          name: grafana-dashboard-router-ifmib
          subPath: watoom-router-ifmib.json
        - mountPath: /var/lib/grafana/dashboards/router-mktxp-exporter.json
          name: grafana-dashboard-mktxp-hostpath
          readOnly: true
        - mountPath: /var/lib/grafana/dashboards/qwen38-llm-metrics.json
          name: grafana-dashboard-qwen38-llm-metrics-hostpath
        - mountPath: /var/lib/grafana/dashboards/opencode-local-llm.json
          name: grafana-dashboard-opencode-local-llm-hostpath
          readOnly: true
        - mountPath: /var/lib/grafana/dashboards/router-firewall-logs.json
          name: grafana-dashboard-router-firewall-logs
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /app/grafana/data
          type: ''
        name: grafana-data
      - configMap:
          defaultMode: 420
          name: grafana-provisioning
        name: grafana-provisioning
      - configMap:
          defaultMode: 420
          name: grafana-dashboard-router-ifmib
        name: grafana-dashboard-router-ifmib
      - hostPath:
          path: /data/github/watoom-standardised-homelab/standardised_k3s_project/config/grafana/dashboards/router-mktxp-exporter.json
          type: File
        name: grafana-dashboard-mktxp-hostpath
      - hostPath:
          path: /data/github/watoom-standardised-homelab/standardised_k3s_project/config/grafana/dashboards/qwen38-llm-metrics.json
          type: File
        name: grafana-dashboard-qwen38-llm-metrics-hostpath
      - hostPath:
          path: /data/github/watoom-standardised-homelab/standardised_k3s_project/config/grafana/dashboards/opencode-local-llm.json
          type: File
        name: grafana-dashboard-opencode-local-llm-hostpath
      - hostPath:
          path: /data/github/watoom-standardised-homelab/standardised_k3s_project/config/grafana/dashboards/router-firewall-logs.json
          type: File
        name: grafana-dashboard-router-firewall-logs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: kubectl
  name: prometheus
  namespace: monitoring
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: prometheus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: monitoring
    spec:
      containers:
      - args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=30d
        - --web.enable-lifecycle
        image: docker.io/prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
        imagePullPolicy: Always
        name: prometheus
        ports:
        - containerPort: 9090
          protocol: TCP
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/prometheus
          name: prometheus-config
        - mountPath: /etc/prometheus/rules
          name: prometheus-opencode-observability-rules
          readOnly: true
        - mountPath: /prometheus
          name: prometheus-data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: prometheus
      serviceAccountName: prometheus
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: prometheus-config
        name: prometheus-config
      - configMap:
          name: watoom-opencode-alert-rules
        name: prometheus-opencode-observability-rules
      - hostPath:
          path: /app/prometheus/data
          type: ''
        name: prometheus-data
