---
# Only the GPU fields Grafana dashboards and helpers actually query (plus clock and XID
# health). The image default collects 26 fields; trimming them cuts exporter memory/CPU.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dcgm-exporter-counters
  namespace: monitoring
  labels:
    app.kubernetes.io/name: dcgm-exporter
    app.kubernetes.io/part-of: monitoring
data:
  counters.csv: |
    DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization (in %).
    DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory utilization (in %).
    DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free (in MiB).
    DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used (in MiB).
    DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature (in C).
    DCGM_FI_DEV_POWER_USAGE, gauge, Power draw (in W).
    DCGM_FI_DEV_SM_CLOCK, gauge, SM clock frequency (in MHz).
    DCGM_FI_DEV_XID_ERRORS, gauge, Value of the last XID error encountered.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: monitoring
  labels:
    app: dcgm-exporter
    app.kubernetes.io/name: dcgm-exporter
    app.kubernetes.io/part-of: monitoring
spec:
  selector:
    matchLabels:
      app: dcgm-exporter
  template:
    metadata:
      labels:
        app: dcgm-exporter
        app.kubernetes.io/name: dcgm-exporter
        app.kubernetes.io/part-of: monitoring
    spec:
      runtimeClassName: nvidia
      tolerations:
      - operator: Exists
      containers:
      - name: dcgm-exporter
        image: docker.io/nvidia/dcgm-exporter:4.5.1-4.8.0-ubuntu22.04
        imagePullPolicy: IfNotPresent
        args:
        - -f
        - /etc/dcgm-exporter/custom/counters.csv
        env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: utility,compute
        - name: DCGM_EXPORTER_KUBERNETES
          value: "true"
        ports:
        - name: metrics
          containerPort: 9400
          protocol: TCP
        securityContext:
          capabilities:
            add:
            - SYS_ADMIN
        volumeMounts:
        - name: pod-gpu-resources
          mountPath: /var/lib/kubelet/pod-resources
          readOnly: true
        - name: counters
          mountPath: /etc/dcgm-exporter/custom
          readOnly: true
      volumes:
      - name: counters
        configMap:
          name: dcgm-exporter-counters
      - name: pod-gpu-resources
        hostPath:
          path: /var/lib/kubelet/pod-resources
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  namespace: monitoring
  labels:
    app: dcgm-exporter
    app.kubernetes.io/name: dcgm-exporter
    app.kubernetes.io/part-of: monitoring
spec:
  selector:
    app: dcgm-exporter
  ports:
  - name: metrics
    port: 9400
    targetPort: metrics
    protocol: TCP
