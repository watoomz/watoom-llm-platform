---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mktxp-config
  namespace: monitoring
data:
  _mktxp.conf: |
    [MKTXP]
        listen = '0.0.0.0:49090'
        socket_timeout = 5
        initial_delay_on_failure = 120
        max_delay_on_failure = 900
        delay_inc_div = 5
        bandwidth = False
        bandwidth_test_dns_server = 8.8.8.8
        bandwidth_test_interval = 600
        minimal_collect_interval = 60
        verbose_mode = False
        fetch_routers_in_parallel = False
        max_worker_threads = 2
        max_scrape_duration = 30
        total_max_scrape_duration = 60
        http_server_threads = 8
        persistent_router_connection_pool = True
        persistent_dhcp_cache = True
        compact_default_conf_values = False
        prometheus_headers_deduplication = False
        probe_connection_pool = False
        probe_connection_pool_ttl = 300
        probe_connection_pool_max_size = 128
  mktxp.conf: |
    [WatooM-Router]
        hostname = 10.99.20.1
        credentials_file = /etc/mktxp/credentials.yml
        custom_labels = site:homelab, role:edge-router

    [default]
        enabled = True
        module_only = False
        hostname = localhost
        port = 8728
        username = mktxp_user
        password = changeme
        credentials_file = ""
        custom_labels = None
        use_ssl = False
        no_ssl_certificate = False
        ssl_certificate_verify = False
        ssl_check_hostname = True
        ssl_ca_file = ""
        plaintext_login = True
        health = True
        installed_packages = True
        dhcp = True
        dhcp_lease = True
        connections = True
        connection_stats = False
        connection_stats_destinations = False
        interface = True
        interface_with_default_name = False
        routerboard = True
        wireguard_peers = False
        bridge_vlan = False
        route = True
        pool = True
        firewall = True
        neighbor = True
        address_list = None
        total_address_list_counts = True
        dns = False
        ipv6_route = False
        ipv6_pool = False
        ipv6_firewall = False
        ipv6_neighbor = False
        ipv6_address_list = None
        ipv6_total_address_list_counts = False
        poe = False
        monitor = True
        netwatch = True
        public_ip = True
        wireless = False
        wireless_clients = False
        capsman = False
        capsman_clients = False
        w60g = False
        eoip = False
        gre = False
        ipip = False
        lte = False
        ipsec = False
        switch_port = False
        kid_control_assigned = False
        kid_control_dynamic = False
        user = True
        queue = True
        bfd = False
        bgp = False
        routing_stats = False
        certificate = False
        container = False
        remote_dhcp_entry = None
        remote_capsman_entry = None
        interface_name_format = name
        check_for_updates = False
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mktxp
    app.kubernetes.io/name: mktxp
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: kubectl
  name: mktxp
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mktxp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mktxp
        app.kubernetes.io/name: mktxp
        app.kubernetes.io/part-of: monitoring
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --cfg-dir
        - /etc/mktxp
        - export
        command:
        - mktxp
        image: ghcr.io/akpw/mktxp@sha256:2b3ccb1c2bd9079b4a9d1f3ad8f854b86db3d7f8d621372f585588331300d63e
        readinessProbe:  # T-0115: gate traffic on the port actually listening (never restarts the pod)
          tcpSocket:
            port: 49090
          periodSeconds: 20
          failureThreshold: 3
        imagePullPolicy: Always
        name: mktxp
        ports:
        - containerPort: 49090
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - mountPath: /etc/mktxp/_mktxp.conf
          name: mktxp-config
          subPath: _mktxp.conf
        - mountPath: /etc/mktxp/mktxp.conf
          name: mktxp-config
          subPath: mktxp.conf
        - mountPath: /etc/mktxp/credentials.yml
          name: mktxp-credentials
          subPath: credentials.yml
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: mktxp-config
        name: mktxp-config
      - name: mktxp-credentials
        secret:
          secretName: mktxp-credentials
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: mktxp
    app.kubernetes.io/name: mktxp
    app.kubernetes.io/part-of: monitoring
  name: mktxp
  namespace: monitoring
spec:
  ports:
  - port: 49090
    protocol: TCP
    targetPort: 49090
  selector:
    app: mktxp
  type: ClusterIP
