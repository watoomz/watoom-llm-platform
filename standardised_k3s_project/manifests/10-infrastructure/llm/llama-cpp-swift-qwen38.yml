apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-swift-qwen38-coder
  namespace: llama-cpp
  labels:
    app: llama-cpp-swift-qwen38-coder
    app.kubernetes.io/name: llama-cpp-swift-qwen38-coder
    app.kubernetes.io/part-of: llama-cpp
    homelab.example/model-family: swift-qwen38
    homelab.example/profile: coder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-cpp-swift-qwen38-coder
  template:
    metadata:
      annotations:
        homelab.example/llama-parallel: '1'
        homelab.example/qwen38-ascii-context: '32768'
        homelab.example/qwen38-ascii-stage: mtp
        homelab.example/model-repository: ajgazin/Swift-1.5-Qwen3.8-27B-Uncensored-Dynamic-MTP-GGUF
        homelab.example/model-revision: 540448475b2a84843fa2a54fcfd9c888de8a99ca
        homelab.example/model-sha256: 9341ee462261bde1dc357ca995704b6a6541852c74c11e89ec490418cdc0051b
        homelab.example/model-quant: UD-IQ4_XS
      labels:
        app: llama-cpp-swift-qwen38-coder
        app.kubernetes.io/name: llama-cpp-swift-qwen38-coder
        app.kubernetes.io/part-of: llama-cpp
        homelab.example/model-family: swift-qwen38
        homelab.example/profile: coder
    spec:
      containers:
      - args:
        - --repeat-last-n
        - '256'
        - --temp
        - '1.0'
        - --top-p
        - '0.95'
        - --top-k
        - '20'
        - --min-p
        - '0.0'
        - --presence-penalty
        - '0.0'
        - --repeat-penalty
        - '1.0'
        - --n-cpu-ffn
        - '0'
        - --spec-type
        - draft-mtp
        - --reasoning
        - 'on'
        - --reasoning-effort
        - 'low'
        - --spec-draft-n-max
        - '5'
        # Custom chat template (overrides the GGUF-embedded one; --jinja stays on). Source of truth is
        # config/llm/swift-qwen38-chat-template.jinja, mirrored byte-for-byte into the ConfigMap below.
        # Adds a 'medium' reasoning instruction (the embedded template injects none at medium) and makes
        # the 'low' instruction terser. Owner 2026-11-06: low=terse, medium=moderate.
        - --chat-template-file
        - /chat-template/swift-qwen38.jinja
        env:
        - name: TZ
          value: Australia/Brisbane
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        - name: LLAMA_ARG_HOST
          value: 0.0.0.0
        - name: LLAMA_ARG_PORT
          value: '8000'
        - name: LLAMA_ARG_MODEL
          value: /models/Swift-1.5-Qwen3.8-27B-Uncensored-Dynamic-MTP-UD-IQ4_XS.gguf
        - name: LLAMA_ARG_ALIAS
          value: swift-qwen38-coder
        # Owner choice 2026-11-02: switch speed between long sessions does not matter. A 60K-token
        # session saves as ~4.4 GB (hybrid-model recurrent checkpoints), so long sessions re-prefill on
        # return; same-session turns reuse the GPU slot and are unaffected. Smaller sessions still cache.
        # 2026-11-11 owner choice: keep only ~one long session in RAM (saves ~2 GiB of the ~10 GiB host footprint); the
        # disk tier below holds the rest and a cold resume costs a few seconds.
        - name: LLAMA_ARG_CACHE_RAM
          value: '2048'
        # Cap per-slot context checkpoints (default 32, ~150 MiB each on this hybrid model, held in host RAM outside
        # the cache limit). 2026-11-11 host OOM: the slot held ~11.5 GiB of checkpoints + ~3 GiB save copies (audit C-013).
        - name: LLAMA_ARG_CTX_CHECKPOINTS
          value: '12'
        # llamAmpere disk tier for RAM-evicted prompt states: on the /app SSD, not the container overlay on the
        # root disk (entries survive pod recreation) and not the shared /data HDD (a spill there blocked the
        # server for 17-65 s). Holds conversation state; host directory is root-only 0700.
        - name: LLAMA_ARG_CACHE_DISK_PATH
          value: /prompt-cache
        - name: LLAMA_ARG_CACHE_DISK_LIMIT
          value: '16384'
        # Background disk writer (watoom llamAmpere 943cbe3): evictions are written off the server loop; at most
        # one queued/being written, a further eviction while busy is dropped and counted in /metrics.
        - name: LLAMA_ARG_CACHE_DISK_ASYNC
          value: '1'
        - name: LLAMA_ARG_CTX_SIZE
          value: '131072'
        - name: LLAMA_ARG_N_GPU_LAYERS
          value: all
        # turbo5/turbo4 KV: owner-adopted 2026-11-03 (KLD 0.003983 vs q4_0 0.007172 against a q8_0 reference).
        # Rollback: q4_0/q4_0 with UBATCH removed, spec-draft-n-max 4 and GGML_CUDA_DISABLE_GRAPHS=1.
        - name: LLAMA_ARG_CACHE_TYPE_K
          value: turbo5
        - name: LLAMA_ARG_CACHE_TYPE_V
          value: turbo4
        - name: LLAMA_ARG_UBATCH
          value: '1024'
        - name: LLAMA_ARG_THREADS
          value: '8'
        - name: LLAMA_ARG_CONT_BATCHING
          value: 'true'
        - name: LLAMA_ARG_ENDPOINT_METRICS
          value: 'true'
        - name: LLAMA_ARG_FLASH_ATTN
          value: 'on'
        - name: LLAMA_ARG_N_PARALLEL
          value: '1'
        - name: LLAMA_ARG_JINJA
          value: 'true'
        - name: LLAMA_ARG_MMPROJ
          value: /models/mmproj-BF16.gguf
        - name: LLAMA_ARG_MMPROJ_OFFLOAD
          value: 'false'
        # llamAmpere v0.6.2 (commit e9193f81423a, sm86 build, recipe tools/llm/llamampere-sm86.Containerfile on the
        # inference-performance branch). Owner-adopted 2026-11-02 over upstream b10666; rollback = the "previous" image.
        # previous: ghcr.io/ggml-org/llama.cpp@sha256:150b59966fb5b2cb1a8fa9d226267c56ebd22c520c7b3640331cde87f3c4fb01
        image: 127.0.0.1:5000/watoom-llamampere@sha256:3bb755f835b65f8d5e9db3ec0cd65ce860efd6633f4e0b7d6338c9b6286a8b2e
        imagePullPolicy: IfNotPresent
        # 2026-11-19: loads grew from 220-320 s (early Nov) to 450 s+ on the shared spinning /data disk; liveness alone
        # (180 s + 6 x 30 s) killed the primary mid-load. The startup probe allows 15 min; liveness starts after it.
        startupProbe:
          failureThreshold: 90
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 10
          timeoutSeconds: 10
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 180
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 10
        name: llama-server
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 42
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '8'
            memory: 20Gi
            nvidia.com/gpu: '1'
          requests:
            cpu: 500m
            memory: 8Gi   # near steady use (was 5Gi) so the kernel kills other pods first under memory pressure
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /models
          name: models
          readOnly: true
        - mountPath: /qwen38-ascii-condensed
          name: qwen38-ascii-model
          readOnly: true
        - mountPath: /prompt-cache
          name: prompt-cache
        - mountPath: /chat-template
          name: chat-template
          readOnly: true
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - python3
        - -c
        - |
          import hashlib, json, os
          from pathlib import Path
          # 2026-11-19: hashing 15 GB on EVERY start doubled the disk reads of a model switch (~3 min at ~80 MB/s). A file whose
          # size, inode, mtime and ctime match the record of its last successful hash is not hashed again; ctime changes on
          # any write and cannot be set back by a user, so an edited file is always re-hashed.
          files = [('Swift-1.5-Qwen3.8-27B-Uncensored-Dynamic-MTP-UD-IQ4_XS.gguf',14252844672, '9341ee462261bde1dc357ca995704b6a6541852c74c11e89ec490418cdc0051b'),('mmproj-BF16.gguf', 931145888, '19acd7fcf4ee504328566eddf0f8e603ef853a205b4830209d2a4908213abdea')]
          for name, size, digest in files:
              p = Path('/models') / name
              st = p.stat() if p.is_file() else None
              assert st and st.st_size == size, 'Model/projector missing or wrong size'
              key = {'name': name, 'size': st.st_size, 'ino': st.st_ino, 'mtime_ns': st.st_mtime_ns, 'ctime_ns': st.st_ctime_ns, 'sha256': digest}
              stamp = Path('/verified') / (name + '.verified.json')
              try:
                  if json.loads(stamp.read_text()) == key:
                      print('unchanged since verified:', name, flush=True)
                      continue
              except (OSError, ValueError):
                  pass
              h = hashlib.sha256()
              with p.open('rb') as f:
                  while block := f.read(8 * 1024 * 1024):
                      h.update(block)
              assert h.hexdigest() == digest, 'Model/projector SHA256 mismatch'
              tmp = stamp.with_name(stamp.name + '.tmp')
              tmp.write_text(json.dumps(key))
              os.replace(tmp, stamp)
              print('hashed and recorded:', name, flush=True)
        image: docker.io/library/python@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
        imagePullPolicy: IfNotPresent
        name: wait-for-model
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /models
          name: models
          readOnly: true
        - mountPath: /verified
          name: model-verified
      restartPolicy: Always
      runtimeClassName: nvidia
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /data/ai/models/gguf/swift-1.5-qwen3.8-27b-uncensored-dynamic-mtp
          type: Directory
        name: models
      - hostPath:
          path: /data/ai/models/verified/swift-qwen38-coder
          type: DirectoryOrCreate
        name: model-verified
      - hostPath:
          path: /data/ai/models/gguf/qwen3.8-27b-ascii-condensed
          type: Directory
        name: qwen38-ascii-model
      - hostPath:
          path: /app/ai/cache/llamampere/prompt-cache
          type: Directory
        name: prompt-cache
      - configMap:
          name: llama-cpp-swift-qwen38-chat-template
        name: chat-template
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp-swift-qwen38-coder
  namespace: llama-cpp
spec:
  selector:
    app: llama-cpp-swift-qwen38-coder
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-cpp-swift-qwen38-chat-template
  namespace: llama-cpp
  # Mirror of config/llm/swift-qwen38-chat-template.jinja (canonical source). Keep byte-identical.
data:
  swift-qwen38.jinja: |-
    {%- set image_count = namespace(value=0) %}
    {%- set video_count = namespace(value=0) %}
    {%- macro render_content(content, do_vision_count, is_system_content=false) %}
        {%- if content is string %}
            {{- content }}
        {%- elif content is iterable and content is not mapping %}
            {%- for item in content %}
                {%- if 'image' in item or 'image_url' in item or item.type == 'image' %}
                    {%- if is_system_content %}
                        {{- raise_exception('System message cannot contain images.') }}
                    {%- endif %}
                    {%- if do_vision_count %}
                        {%- set image_count.value = image_count.value + 1 %}
                    {%- endif %}
                    {%- if add_vision_id %}
                        {{- 'Picture ' ~ image_count.value ~ ': ' }}
                    {%- endif %}
                    {{- '<|vision_start|><|image_pad|><|vision_end|>' }}
                {%- elif 'video' in item or item.type == 'video' %}
                    {%- if is_system_content %}
                        {{- raise_exception('System message cannot contain videos.') }}
                    {%- endif %}
                    {%- if do_vision_count %}
                        {%- set video_count.value = video_count.value + 1 %}
                    {%- endif %}
                    {%- if add_vision_id %}
                        {{- 'Video ' ~ video_count.value ~ ': ' }}
                    {%- endif %}
                    {{- '<|vision_start|><|video_pad|><|vision_end|>' }}
                {%- elif 'text' in item %}
                    {{- item.text }}
                {%- else %}
                    {{- raise_exception('Unexpected item type in content.') }}
                {%- endif %}
            {%- endfor %}
        {%- elif content is none or content is undefined %}
            {{- '' }}
        {%- else %}
            {{- raise_exception('Unexpected content type.') }}
        {%- endif %}
    {%- endmacro %}
    {%- if not messages %}
        {{- raise_exception('No messages provided.') }}
    {%- endif %}
    {%- set reasoning_instructions = '' %}
    {%- if enable_thinking is undefined or enable_thinking is true %}
        {%- set resolved_reasoning_effort = reasoning_effort|default('xhigh') %}
        {%- if resolved_reasoning_effort not in ('xhigh', 'medium', 'low') %}
            {{- raise_exception('Unexpected reasoning effort ' ~ reasoning_effort ~ '. Supported types are xhigh (default), medium, and low.') }}
        {%- endif %}
        {%- if resolved_reasoning_effort == 'xhigh' %}
            {%- set reasoning_instructions = 'Reasoning effort is set to xhigh. Please think carefully through the task, validate key assumptions, consider plausible alternatives, and prioritize correctness, consistency, and clarity in the final answer.' %}
        {%- elif resolved_reasoning_effort == 'medium' %}
            {%- set reasoning_instructions = 'Reasoning effort is set to medium. Work through the key steps and check the main assumptions, but keep the reasoning concise and proportional to the task, without exhaustive enumeration.' %}
        {%- elif resolved_reasoning_effort == 'low' %}
            {%- set reasoning_instructions = 'Reasoning effort is set to low. Keep thinking to a few short steps, then give the answer directly.' %}
        {%- endif %}
    {%- endif %}
    {%- if tools and tools is iterable and tools is not mapping %}
        {{- '<|im_start|>system\n' }}
        {%- if reasoning_instructions %}
            {{- reasoning_instructions + '\n\n' }}
        {%- endif %}
        {{- "# Tools\n\nYou have access to the following functions:\n\n<tools>" }}
        {%- for tool in tools %}
            {{- "\n" }}
            {{- tool | tojson }}
        {%- endfor %}
        {{- "\n</tools>" }}
        {{- '\n\nIf you choose to call a function ONLY reply in the following format with NO suffix:\n\n<tool_call>\n<function=example_function_name>\n<parameter=example_parameter_1>\nvalue_1\n</parameter>\n<parameter=example_parameter_2>\nThis is the value for the second parameter\nthat can span\nmultiple lines\n</parameter>\n</function>\n</tool_call>\n\n<IMPORTANT>\nReminder:\n- Function calls MUST follow the specified format: an inner <function=...></function> block must be nested within <tool_call></tool_call> XML tags\n- Required parameters MUST be specified\n- You may provide optional reasoning for your function call in natural language BEFORE the function call, but NOT after\n- If there is no function call available, answer the question like normal with your current knowledge and do not tell the user about function calls\n</IMPORTANT>' }}
        {%- if messages[0].role == 'system' %}
            {%- set content = render_content(messages[0].content, false, true)|trim %}
            {%- if content %}
                {{- '\n\n' + content }}
            {%- endif %}
        {%- endif %}
        {{- '<|im_end|>\n' }}
    {%- else %}
        {%- if messages[0].role == 'system' %}
            {%- set content = render_content(messages[0].content, false, true)|trim %}
            {%- if content %}
                {{- '<|im_start|>system\n' + (reasoning_instructions + '\n\n' if reasoning_instructions else '')  + content + '<|im_end|>\n' }}
            {%- elif reasoning_instructions %}
                {{- '<|im_start|>system\n' + reasoning_instructions + '<|im_end|>\n' }}
            {%- endif %}
        {%- elif reasoning_instructions %}
            {{- '<|im_start|>system\n' + reasoning_instructions + '<|im_end|>\n' }}
        {%- endif %}
    {%- endif %}
    {%- set ns = namespace(multi_step_tool=true, last_query_index=messages|length - 1) %}
    {%- for message in messages[::-1] %}
        {%- set index = (messages|length - 1) - loop.index0 %}
        {%- if ns.multi_step_tool and message.role == "user" %}
            {%- set content = render_content(message.content, false)|trim %}
            {%- if not(content.startswith('<tool_response>') and content.endswith('</tool_response>')) %}
                {%- set ns.multi_step_tool = false %}
                {%- set ns.last_query_index = index %}
            {%- endif %}
        {%- endif %}
    {%- endfor %}
    {%- if ns.multi_step_tool %}
        {{- raise_exception('No user query found in messages.') }}
    {%- endif %}
    {%- for message in messages %}
        {%- set content = render_content(message.content, true)|trim %}
        {%- if message.role == "system" %}
            {%- if not loop.first %}
                {{- raise_exception('System message must be at the beginning.') }}
            {%- endif %}
        {%- elif message.role == "user" %}
            {{- '<|im_start|>' + message.role + '\n' + content + '<|im_end|>' + '\n' }}
        {%- elif message.role == "assistant" %}
            {%- set reasoning_content = '' %}
            {%- if message.reasoning_content is string %}
                {%- set reasoning_content = message.reasoning_content %}
            {%- endif %}
            {%- set reasoning_content = reasoning_content|trim %}
            {%- if preserve_thinking is undefined or preserve_thinking is true or loop.index0 > ns.last_query_index %}
                {{- '<|im_start|>' + message.role + '\n<think>\n' + reasoning_content + '\n</think>\n\n' + content }}
            {%- else %}
                {{- '<|im_start|>' + message.role + '\n' + content }}
            {%- endif %}
            {%- if message.tool_calls and message.tool_calls is iterable and message.tool_calls is not mapping %}
                {%- for tool_call in message.tool_calls %}
                    {%- if tool_call.function is defined %}
                        {%- set tool_call = tool_call.function %}
                    {%- endif %}
                    {%- if loop.first %}
                        {%- if content|trim %}
                            {{- '\n\n<tool_call>\n<function=' + tool_call.name + '>\n' }}
                        {%- else %}
                            {{- '<tool_call>\n<function=' + tool_call.name + '>\n' }}
                        {%- endif %}
                    {%- else %}
                        {{- '\n<tool_call>\n<function=' + tool_call.name + '>\n' }}
                    {%- endif %}
                    {%- if tool_call.arguments is defined and tool_call.arguments != '' %}
                        {%- for args_name, args_value in tool_call.arguments|items %}
                            {{- '<parameter=' + args_name + '>\n' }}
                            {%- set args_value = args_value | string if args_value is string else args_value | tojson | safe %}
                            {{- args_value }}
                            {{- '\n</parameter>\n' }}
                        {%- endfor %}
                    {%- endif %}
                    {{- '</function>\n</tool_call>' }}
                {%- endfor %}
            {%- endif %}
            {{- '<|im_end|>\n' }}
        {%- elif message.role == "tool" %}
            {%- if loop.previtem and loop.previtem.role != "tool" %}
                {{- '<|im_start|>user' }}
            {%- endif %}
            {{- '\n<tool_response>\n' }}
            {{- content }}
            {{- '\n</tool_response>' }}
            {%- if not loop.last and loop.nextitem.role != "tool" %}
                {{- '<|im_end|>\n' }}
            {%- elif loop.last %}
                {{- '<|im_end|>\n' }}
            {%- endif %}
        {%- else %}
            {{- raise_exception('Unexpected message role.') }}
        {%- endif %}
    {%- endfor %}
    {%- if add_generation_prompt %}
        {{- '<|im_start|>assistant\n' }}
        {%- if enable_thinking is defined and enable_thinking is false %}
            {{- '<think>\n\n</think>\n\n' }}
        {%- else %}
            {{- '<think>\n' }}
        {%- endif %}
    {%- endif %}
