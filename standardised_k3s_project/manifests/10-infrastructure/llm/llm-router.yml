    120\"))\nSWITCH_LOCK_TIMEOUT = int(os.environ.get(\"SWITCH_LOCK_TIMEOUT_SECONDS\", \"300\"))\n# 2026-11-19:\
    \ while the controller switches models (5-7 min for a 27B gguf read fresh from disk) it handles one\
