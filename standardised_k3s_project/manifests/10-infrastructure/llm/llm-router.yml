    \                with SWITCHES_IN_FLIGHT_LOCK:\n                    SWITCHES_IN_FLIGHT[0] -= 1\n\n\
    # ThreadingHTTPServer processes requests concurrently. GPU model lifecycle\n# changes must therefore\
