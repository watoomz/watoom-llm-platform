    }\n\nMODEL_CALL_LIMIT = int(os.environ.get(\"WATOOM_MODEL_MAX_CALLS\", \"3\"))\nMODEL_CALL_TTL_SECONDS\
    \ = int(os.environ.get(\"WATOOM_MODEL_CALL_TTL_SECONDS\", \"900\"))\nMODEL_CALL_COUNTS = {}\nMODEL_CALL_LOCK\
