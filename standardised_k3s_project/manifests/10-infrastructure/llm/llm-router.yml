    error\":str(exc)}\n\n        time.sleep(2)\n\n    raise TimeoutError(\n        f\"deployment {name}\
    \ did not fully stop \"\n        f\"within {timeout}s; last={last}\"\n    )\n\ndef wait_available(name,\
