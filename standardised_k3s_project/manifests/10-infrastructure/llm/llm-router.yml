    \ cancellation.\n                    print(\"[WATOOM_REQUEST_ACCOUNTING] completion unverified\",flush=True)\n\
    \nif __name__ == \"__main__\":\n    port = int(os.environ.get(\"PORT\", \"8000\"))\n    print(f\"\
    llm-router listening on :{port}\", flush=True)\n    ThreadingHTTPServer((\"0.0.0.0\", port), Handler).serve_forever()\n"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-router-scale
  namespace: llama-cpp
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router
  namespace: llama-cpp
  labels:
    app: llm-router
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: llm-router
    app.kubernetes.io/part-of: llama-cpp
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: llm-router
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: llm-router
        app.kubernetes.io/name: llm-router
        app.kubernetes.io/part-of: llama-cpp
    spec:
      containers:
      - command:
        - python3
        - /app/router.py
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: PORT
          value: '8000'
        - name: WATOOM_MODEL_MAX_CALLS
          value: '3'
        - name: WATOOM_MODEL_CALL_TTL_SECONDS
          value: '900'
        - name: START_TIMEOUT_SECONDS
          value: '240'
        - name: STOP_TIMEOUT_SECONDS
          value: '120'
        - name: SWITCH_LOCK_TIMEOUT_SECONDS
          value: '300'
        - name: WATOOM_MANAGED_CATALOG
          value: /managed-models/catalog.json
        - name: WATOOM_MANAGED_KEY
          value: /private/backend-key
        image: docker.io/library/python@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 4
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: router
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app
          name: app
          readOnly: true
        - name: gpu-controller
          mountPath: /gpu-controller
          readOnly: true
        - name: managed-models
          mountPath: /managed-models
          readOnly: true
        - name: managed-key
          mountPath: /private/backend-key
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: llm-router
      serviceAccountName: llm-router
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: llm-router-app
        name: app
      - name: gpu-controller
        hostPath:
          path: /data/ai/helper-scripts/state/gpu-controller-router
          type: Directory
      - name: managed-models
        hostPath:
          path: /data/ai/helper-scripts/state/model-manager-router
          type: Directory
      - name: managed-key
        hostPath:
          path: /data/ai/private/model-manager/backend-key
          type: File
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: llm-router
  namespace: llama-cpp
  labels:
    app.kubernetes.io/name: llm-router
    app.kubernetes.io/part-of: llm-router
    app.kubernetes.io/managed-by: kubectl
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`llm-router.internal.homelab.example`)
    services:
    - name: llm-router
      namespace: llama-cpp
      port: 8000
      nativeLB: true
  tls:
    secretName: watoom-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: llm-router-http
  namespace: llama-cpp
  labels:
    app.kubernetes.io/name: llm-router-http
    app.kubernetes.io/part-of: llm-router
    app.kubernetes.io/managed-by: kubectl
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`llm-router.internal.homelab.example`)
    services:
    - name: llm-router
      namespace: llama-cpp
      port: 8000
      nativeLB: true
