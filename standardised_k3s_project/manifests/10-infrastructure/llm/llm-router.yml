    \ = [key for key, item in MODEL_CALL_COUNTS.items()\n                 if now - item[\"last_seen\"\
    ] > MODEL_CALL_TTL_SECONDS]\n        for key in stale:\n            MODEL_CALL_COUNTS.pop(key, None)\n\
    \        item = MODEL_CALL_COUNTS.setdefault(request_id, {\"count\": 0, \"last_seen\": now})\n   \
    \     item[\"count\"] += 1\n        item[\"last_seen\"] = now\n        return item[\"count\"]\ndef\
