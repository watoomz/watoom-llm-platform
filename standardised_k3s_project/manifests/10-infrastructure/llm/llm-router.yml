    \  wait_available(target_deploy,START_TIMEOUT)\n        wait_health(target['url'],30)\n        return\
    \ target\n    finally:\n        MODEL_SWITCH_LOCK.release()\n\n\n\n\n# 2026-11-19 (owner): WatooM\
