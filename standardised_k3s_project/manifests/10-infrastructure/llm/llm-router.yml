    \ r in PERF_EVENTS if now - r[\"at\"] <= PERF_WINDOW_SECONDS]\n    result = {}\n    for effort in\
    \ (\"low\", \"medium\", \"high\", \"xhigh\", \"unset\", \"other\"):\n        group = [r for r in rows\
    \ if (r[\"effort\"] if r[\"effort\"] in (\"low\", \"medium\", \"high\", \"xhigh\", \"unset\") else\
    \ \"other\") == effort]\n        if not group:\n            result[effort] = {\"requests\": 0, \"\
    latency_p50_ms\": None, \"latency_p95_ms\": None, \"ttft_p50_ms\": None,\n                       \
    \       \"errors\": 0, \"http_503\": 0, \"generation_tokens_per_second\": None,\n                \
    \              \"prompt_tokens_per_second\": None}\n            continue\n        latencies = sorted(r[\"\
    latency_ms\"] for r in group)\n        ttfts = sorted(r[\"ttft_ms\"] for r in group if r[\"ttft_ms\"\
    ] is not None)\n        percentile = lambda values, q: values[max(0, min(len(values)-1, int(q*len(values)+.999999)-1))]\
    \ if values else None\n        result[effort] = {\"requests\": len(group), \"latency_p50_ms\": round(percentile(latencies,\
    \ .50), 1),\n                          \"latency_p95_ms\": round(percentile(latencies, .95), 1),\n\
    \                          \"ttft_p50_ms\": round(percentile(ttfts, .50), 1) if ttfts else None,\n\
    \                          \"errors\": sum(r[\"status\"] >= 400 for r in group),\n               \
    \           \"http_503\": sum(r[\"status\"] == 503 for r in group),\n                          \"\
    generation_tokens_per_second\": None, \"prompt_tokens_per_second\": None}\n    return {\"window_seconds\"\
    : PERF_WINDOW_SECONDS, \"generated\": now, \"levels\": result}\n\n\nclass Handler(BaseHTTPRequestHandler):\n\
    \    protocol_version = \"HTTP/1.1\"\n\n    def log_message(self, fmt, *args):\n        print(f\"\
    {self.address_string()} {self.command} {self.path} \" + (fmt % args), flush=True)\n\n    def send_json(self,\
    \ status, payload):\n        data = json.dumps(payload).encode(\"utf-8\")\n        self.send_response(status)\n\
    \        self.send_header(\"Content-Type\", \"application/json\")\n        self.send_header(\"Content-Length\"\
    , str(len(data)))\n        self.end_headers()\n        self.wfile.write(data)\n\n    def do_GET(self):\n\
    \        refresh_managed_catalog()\n        if self.path == \"/performance\":\n            self.send_json(200,\
    \ performance_summary())\n            return\n        if self.path == \"/healthz\":\n            self.send_json(200,\
    \ {\"status\": \"ok\"})\n            return\n        if self.path in (\"/health\", \"/\"):\n     \
    \       self.send_json(200, {\"status\": \"ok\", \"active_deployment\": active_deployment()})\n  \
    \          return\n        if self.path == \"/v1/models\":\n            self.send_json(200, model_list())\n\
    \            return\n        if self.path == \"/models\":\n            self.send_json(200, lifecycle_catalog())\n\
    \            return\n        if self.path == \"/models/status\":\n            self.send_json(200,\
    \ lifecycle_status())\n            return\n        self.proxy(\"GET\")\n\n    def do_POST(self):\n\
    \        refresh_managed_catalog()\n        if self.path == \"/models/load\":\n            length\
    \ = int(self.headers.get(\"Content-Length\", \"0\"))\n            body = self.rfile.read(length) if\
    \ length else b\"{}\"\n\n            try:\n                payload = json.loads(body.decode(\"utf-8\"\
    ))\n                requested_model = str(payload.get(\"model\") or \"\").strip()\n              \
    \  resolved_model = MODEL_ALIASES.get(\n                    requested_model,\n                   \
    \ requested_model,\n                )\n\n                if resolved_model not in MODELS:\n      \
    \              self.send_json(\n                        404,\n                        {\n        \
    \                    \"error\": \"unknown model\",\n                            \"requested_model\"\
    : requested_model,\n                            \"mapped_router_model\": resolved_model,\n       \
    \                     \"available_model_ids\": lifecycle_catalog()[\"available_model_ids\"],\n   \
    \                     },\n                    )\n                    return\n\n                target\
    \ = ensure_model(requested_model, allow_switch=True)\n                self.send_json(\n          \
    \          200,\n                    {\n                        \"status\": \"loaded\",\n        \
    \                \"requested_model\": requested_model,\n                        \"model\": resolved_model,\n\
    \                        \"deployment\": target[\"deployment\"],\n                    },\n       \
    \         )\n            except Exception as exc:\n                self.send_json(\n             \
    \       503,\n                    {\n                        \"error\": str(exc),\n              \
