    \           )\n            return\n        self.proxy(\"POST\")\n\n    def proxy(self, method):\n\
    \        performance_started = time.monotonic()\n        performance_effort = \"unset\"\n        performance_enabled\
    \ = False\n        performance_status = 503\n        performance_ttft = None\n        length = int(self.headers.get(\"\
    Content-Length\", \"0\"))\n        body = self.rfile.read(length) if length else b\"\"\n        model_id\
