    \  return canonical_model_id, model_spec\n\n    return None, None\n\n\ndef desired_replicas(name):\n\
    \    d = deploy(name)\n    return int(\n        (d.get(\"spec\") or {}).get(\"replicas\") or 0\n \
    \   )\n\ndef deployment_pods(name):\n    \"\"\"Return pods selected by a model Deployment.\"\"\"\n\
    \    d = deploy(name)\n\n    selector = (\n        (d.get(\"spec\") or {})\n        .get(\"selector\"\
