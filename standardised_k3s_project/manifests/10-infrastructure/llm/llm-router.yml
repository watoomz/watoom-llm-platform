    \ if not chunk:\n                            break\n                        event_buffer += chunk\n\
    \                        while b\"\\n\" in event_buffer:\n                            line, event_buffer\
    \ = event_buffer.split(b\"\\n\", 1)\n                            if performance_ttft is None and sse_has_generated_output(line):\n\
