    url\"] + self.path\n            req = urllib.request.Request(url, data=body if method != \"GET\" else\
    \ None, method=method)\n            for key, value in self.headers.items():\n                if key.lower()\
    \ not in (\"host\", \"content-length\", \"connection\"):\n                    req.add_header(key,\
    \ value)\n            if target.get(\"backend\"):\n                from pathlib import Path\n    \
    \            key_file=os.environ.get(\"WATOOM_MANAGED_KEY\")\n                if not key_file:raise\
    \ RuntimeError(\"Managed backend credentials unavailable\")\n                req.remove_header(\"\
    Authorization\")\n                req.add_header(\"Authorization\",\"Bearer \"+Path(key_file).read_text().strip())\n\
    \            with urllib.request.urlopen(req, timeout=600) as response:\n                performance_status\
    \ = response.status\n                content_type = response.headers.get(\n                    \"\
    Content-Type\",\n                    \"\",\n                )\n\n                backend_is_streaming\
    \ = (\n                    content_type\n                    .lower()\n                    .startswith(\"\
    text/event-stream\")\n                )\n\n                #\n                #\n                #\n\
    \                #\n                if backend_is_streaming:\n                    self.send_response(response.status)\n\
    \n                    for key, value in response.headers.items():\n                        if key.lower()\
    \ not in (\n                            \"transfer-encoding\",\n                            \"connection\"\
    ,\n                            \"content-length\",\n                        ):\n                 \
    \           self.send_header(key, value)\n\n                    self.send_header(\n              \
    \          \"Transfer-Encoding\",\n                        \"chunked\",\n                    )\n \
