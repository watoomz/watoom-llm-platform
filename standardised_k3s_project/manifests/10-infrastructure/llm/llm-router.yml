    Managed catalog disappeared\")\n\nPERF_WINDOW_SECONDS = 86400\nPERF_EVENTS = deque(maxlen=10000)\n\
    PERF_LOCK = threading.Lock()\n\ndef sse_has_generated_output(line):\n    if not line.startswith(b\"\
    data:\"):\n        return False\n    raw = line.partition(b\":\")[2].strip()\n    if not raw or raw\
